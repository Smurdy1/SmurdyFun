name: Apply compact share icon button

on:
  push:
    branches: [feature/share-icon-button]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/share-icon-button
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply share icon changes
        run: node tools/tmp_share_icon_button.js
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate pages
        env:
          SITEMAP_LASTMOD: 2026-09-14
        run: npm run pages:generate
      - name: Check JavaScript
        run: |
          node --check src/js/share.js
          node --check tools/apply_sharing.js
      - name: Run tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Clean helper files and commit
        run: |
          rm tools/tmp_share_icon_button.js
          rm .github/workflows/oneoff-share-icon-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use custom icon for Share controls"
          git push
