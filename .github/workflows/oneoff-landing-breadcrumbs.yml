name: Validate landing breadcrumb navigation

on:
  push:
    branches:
      - ui/landing-breadcrumb-nav

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/landing-breadcrumb-nav
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate landing pages
        env:
          SITEMAP_LASTMOD: '2026-09-08'
        run: npm run pages:generate
      - name: Check syntax
        run: |
          node --check tools/quiz_page_shell.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
      - name: Run breadcrumb and full tests
        run: |
          node --test tests/landing_breadcrumbs.test.js
          npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit regenerated pages
        run: |
          rm -f .github/workflows/oneoff-landing-breadcrumbs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate landing pages with clickable breadcrumb parents"
          git push origin HEAD:ui/landing-breadcrumb-nav
