name: Apply requested Weak Spots tweak

on:
  push:
    branches:
      - codex/mode-specific-weak-spots

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[weak-spots-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mode-specific-weak-spots
          fetch-depth: 0

      - name: Apply edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          weak = Path('src/js/weak_spots.js')
          text = weak.read_text()
          pattern = re.compile(
              r"('<div class=\"weak-spot-name\">' \+ escapeHtml\(entry\.name\) \+ \"</div>\" \+\s*)"
              r"'<div class=\"weak-spot-meta\">' \+\s*"
              r"escapeHtml\(modeLabel\(entry\.mode\)\) \+ \" · \" \+\s*"
              r"Number\(entry\.misses \|\| 0\) \+ \" \" \+\s*"
              r"\(Number\(entry\.misses\) === 1 \? \"miss\" : \"misses\"\) \+\s*"
              r"\"</div>\" \+"
          )
          replacement = (
              r"\1"
              "'<div class=\"weak-spot-meta\">' + escapeHtml(modeLabel(entry.mode)) + \"</div>\" +"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Weak Spots render block replacements: {count}')
          weak.write_text(text)

          core = Path('src/js/app_core.js')
          text = core.read_text()
          old_version = 'const APP_VERSION = "1.13.3";'
          new_version = 'const APP_VERSION = "1.13.4";'
          if old_version not in text:
              raise SystemExit('APP_VERSION 1.13.3 not found')
          core.write_text(text.replace(old_version, new_version, 1))

          workflow = Path('.github/workflows/oneoff-weak-spots-tweak.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Weak Spots labels and bump version [weak-spots-patch]"
          git push origin HEAD:codex/mode-specific-weak-spots
