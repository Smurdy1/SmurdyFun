name: Apply share and 404 UI patches

on:
  push:
    branches: [fix/share-404-ui-patches]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-404-ui-patches
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          share = Path('src/js/share.js')
          text = share.read_text()
          text = text.replace('<button type="button" data-share-action="native">Share...</button>', '<button type="button" data-share-action="native">More</button>')
          text = text.replace('            trigger.textContent = "Share";\n', '            trigger.textContent = "";\n')
          share.write_text(text)

          css = Path('styles/share.css')
          text = css.read_text()
          text = text.replace('/* smurdy-share-icon-button-v1 */', '/* smurdy-share-icon-button-v2 */')
          old = '''    width: 38px;\n    height: 38px;\n    min-width: 38px;\n    min-height: 38px;\n    padding: 0;\n    border-radius: 7px;\n    background: #f3f3f3;\n    color: #343a3f;\n    font-size: 0;\n    line-height: 1;\n'''
          new = '''    width: 38px;\n    height: 38px;\n    min-width: 38px;\n    min-height: 38px;\n    box-sizing: border-box;\n    padding: 0;\n    border-radius: 7px;\n    background: #f3f3f3;\n    color: #343a3f;\n    font-size: 0;\n    line-height: 0;\n    vertical-align: middle;\n    overflow: hidden;\n'''
          if old not in text:
              raise SystemExit('share icon sizing block not found')
          text = text.replace(old, new, 1)
          css.write_text(text)

          page404 = Path('404.html')
          text = page404.read_text()
          text = text.replace('<body>\n  <main>', '<body data-smurdy-404>\n  <main>', 1)
          page404.write_text(text)

          theme = Path('styles/theme.css')
          text = theme.read_text()
          addition = '''\n\n/* 404 dark-mode readability */\nhtml[data-smurdy-theme="dark"] body[data-smurdy-404] {\n    background: #171c20 !important;\n    color: #dfe4e7 !important;\n}\n\nhtml[data-smurdy-theme="dark"] body[data-smurdy-404] p {\n    color: #bbc3c8 !important;\n}\n\nhtml[data-smurdy-theme="dark"] body[data-smurdy-404] .uncharted {\n    color: #aab3b9 !important;\n}\n\nhtml[data-smurdy-theme="dark"] body[data-smurdy-404] nav {\n    border-color: #465159 !important;\n}\n\nhtml[data-smurdy-theme="dark"] body[data-smurdy-404] img {\n    filter: invert(1);\n}\n'''
          if '/* 404 dark-mode readability */' not in text:
              text += addition
          theme.write_text(text)

          apply = Path('tools/apply_sharing.js')
          text = apply.read_text()
          text = text.replace('const ASSET_VERSION = "20260914-sharing-5";', 'const ASSET_VERSION = "20260914-sharing-6";')
          text = text.replace('const THEME_ASSET_VERSION = "20260911-dark-mode-3";', 'const THEME_ASSET_VERSION = "20260914-dark-mode-4";')
          apply.write_text(text)

          sharing_test = Path('tests/sharing.test.js')
          text = sharing_test.read_text()
          text = text.replace('/smurdy-share-icon-button-v1/', '/smurdy-share-icon-button-v2/')
          text += '''\n\ntest("share icon is icon-only, native share says More, and 404 dark mode is readable", () => {\n    const source = read("src/js/share.js");\n    const styles = read("styles/share.css");\n    const theme = read("styles/theme.css");\n    const notFound = read("404.html");\n    assert.match(source, /trigger\\.textContent = ""/);\n    assert.doesNotMatch(source, /data-share-action="native">Share\\.\\.\\.<\\/button>/);\n    assert.match(source, /data-share-action="native">More<\\/button>/);\n    assert.match(styles, /smurdy-share-icon-button-v2/);\n    assert.match(styles, /vertical-align:\\s*middle/);\n    assert.match(notFound, /<body data-smurdy-404>/);\n    assert.match(theme, /404 dark-mode readability/);\n    assert.match(theme, /body\\[data-smurdy-404\\] p[\\s\\S]*color:\\s*#bbc3c8/);\n});\n'''
          sharing_test.write_text(text)

          theme_test = Path('tests/theme.test.js')
          text = theme_test.read_text().replace('20260911-dark-mode-3', '20260914-dark-mode-4')
          theme_test.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate pages
        env:
          SITEMAP_LASTMOD: 2026-09-14
        run: npm run pages:generate
      - name: Check JavaScript
        run: |
          node --check src/js/share.js
          node --check tools/apply_sharing.js
      - name: Run tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Clean helper workflow and commit
        run: |
          rm .github/workflows/oneoff-share-404-ui-patches.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish Share controls and 404 dark mode"
          git push origin HEAD:fix/share-404-ui-patches
