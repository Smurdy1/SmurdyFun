name: One-off capitals dataset build

on:
  push:
    branches:
      - feature/capitals-dataset

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capitals-dataset
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build capitals dataset
        run: npm run capitals:sync

      - name: Check generator syntax
        run: node --check tools/build_capitals.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated capitals dataset
        run: |
          rm -f .github/workflows/oneoff-capitals-dataset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated capitals dataset"
          git push origin HEAD:feature/capitals-dataset
