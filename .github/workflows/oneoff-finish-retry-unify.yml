name: One-off finish shared retry unification

on:
  push:
    branches:
      - refactor/shared-quiz-completion

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-quiz-completion
          fetch-depth: 0

      - name: Apply final retry cleanup
        run: python tools/oneoff_finish_retry_unify.py

      - name: Check JavaScript syntax
        run: |
          node --check src/js/quiz_runner.js
          node --check src/js/weak_spots.js
          node --check src/js/quiz_completion.js
          node --check src/js/flag_quiz.js

      - name: Run focused tests
        run: node --test tests/quiz_completion.test.js tests/quiz_session.test.js tests/flag_quiz.test.js tests/progress_total.test.js tests/weak_spots.test.js

      - name: Run full suite
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit final retry cleanup
        run: |
          rm -f .github/workflows/oneoff-finish-retry-unify.yml tools/oneoff_finish_retry_unify.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish shared Retry Missed ownership"
          git push origin HEAD:refactor/shared-quiz-completion
