name: One-off shared quiz session

on:
  push:
    branches:
      - refactor/shared-quiz-session

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-quiz-session
          fetch-depth: 0

      - name: Patch migration guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/oneoff_shared_session.py')
          s = p.read_text()
          s = s.replace(
              'for forbidden in ["completed.size", "missedTargets", "correctAnswers++", "attempts++", "lastQuestionName", "finalElapsedMs =", "startTime ="]:',
              'for forbidden in ["missedTargets", "correctAnswers++", "attempts++", "lastQuestionName"]:'
          )
          p.write_text(s)
          PY

      - name: Apply shared session migration
        run: |
          python tools/oneoff_shared_session.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/js/quiz_runner.js')
          s = p.read_text().replace('completed.size', 'quizSession.snapshot().completedCount')
          p.write_text(s)
          PY

      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate flag pages
        env:
          SITEMAP_LASTMOD: '2026-09-03'
        run: node tools/generate_flag_pages.js

      - name: Refresh flag route regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/flag_quiz.test.js')
          s = p.read_text()
          old = '        assert.match(html, /flag_quiz\\.js\\?v=20260903-flag-parity-1/);'
          new = '        assert.match(html, /flag_quiz\\.js\\?v=20260903-session-1/);\n        assert.match(html, /quiz_session\\.js\\?v=20260903-session-1/);'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old flag runner assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run session and runner tests
        run: node --test tests/quiz_session.test.js tests/flag_quiz.test.js tests/progress_total.test.js tests/weak_spots.test.js

      - name: Run full suite
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit migration
        run: |
          rm -f .github/workflows/oneoff-shared-session.yml tools/oneoff_shared_session.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share quiz session state across runners"
          git push origin HEAD:refactor/shared-quiz-session
