name: Implement icon rollout

on:
  push:
    branches:
      - polish/1.16.10-icon-rollout

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/1.16.10-icon-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply icon rollout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, f"missing expected text in {path}: {old[:80]}"
              assert s.count(old) == 1, f"expected one match in {path}, got {s.count(old)}"
              p.write_text(s.replace(old, new, 1))

          # Patch release version in the two authoritative version sources and its regression test.
          replace_once('src/js/app_core.js', 'const APP_VERSION = "1.16.9";', 'const APP_VERSION = "1.16.10";')
          Path('src/data/app_version.json').write_text(json.dumps({'version': '1.16.10'}, indent=2) + '\n')
          replace_once('tests/version_badge.test.js', '"1.16.9"', '"1.16.10"')

          # The browser icon work is CSS-only so the existing accessible labels and event behavior stay untouched.
          browser_css = Path('styles/browser_hierarchy.css')
          s = browser_css.read_text()
          marker = '/* 1.16.10 icon rollout */'
          assert marker not in s
          s += r'''

/* 1.16.10 icon rollout */
html body #quiz-browser .qb-library-tab[data-library-view="recent"] {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

html body #quiz-browser .qb-library-tab[data-library-view="recent"]::before,
.weak-spots-menu-button::before,
html body #quiz-browser #qb-mobile-weak-spots::before,
html body #quiz-browser #qb-mobile-collapse-arrow {
    content: "";
    display: block;
    flex: 0 0 auto;
    background-color: currentColor;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    mask-size: contain;
}

html body #quiz-browser .qb-library-tab[data-library-view="recent"]::before {
    width: 14px;
    height: 14px;
    -webkit-mask-image: url('/assets/icons/clock.png');
    mask-image: url('/assets/icons/clock.png');
}

.weak-spots-menu-button::before,
html body #quiz-browser #qb-mobile-weak-spots::before {
    width: 16px;
    height: 16px;
    -webkit-mask-image: url('/assets/icons/crosshair.png');
    mask-image: url('/assets/icons/crosshair.png');
}

html body #quiz-browser #qb-mobile-weak-spots {
    justify-content: flex-start !important;
    gap: 8px;
}

html body #quiz-browser #qb-mobile-weak-spots .weak-spots-count {
    margin-left: auto;
}

html body #quiz-browser #qb-mobile-collapse-arrow {
    width: 17px;
    height: 17px;
    font-size: 0 !important;
    transform: none !important;
    transition: none !important;
    -webkit-mask-image: url('/assets/icons/up_arrow.png');
    mask-image: url('/assets/icons/up_arrow.png');
}

html body #quiz-browser.qb-mobile-collapsed #qb-mobile-collapse-arrow {
    transform: none !important;
    -webkit-mask-image: url('/assets/icons/down_arrow.png');
    mask-image: url('/assets/icons/down_arrow.png');
}
'''
          browser_css.write_text(s)

          # Add icons to every share action without replacing the readable action labels.
          share_css = Path('styles/share.css')
          s = share_css.read_text()
          marker = '/* 1.16.10 share action icons */'
          assert marker not in s
          s += r'''

/* 1.16.10 share action icons */
.smurdy-page-share-actions button {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
}

.smurdy-page-share-actions button::before {
    content: "";
    display: block;
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
}

.smurdy-page-share-actions button[data-share-action="native"]::before,
.smurdy-page-share-actions button[data-share-action="copy"]::before,
.smurdy-page-share-actions button[data-share-action="email"]::before {
    background-color: currentColor;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    mask-size: contain;
}

.smurdy-page-share-actions button[data-share-action="native"]::before {
    -webkit-mask-image: url('/assets/icons/share.png');
    mask-image: url('/assets/icons/share.png');
}

.smurdy-page-share-actions button[data-share-action="copy"]::before {
    -webkit-mask-image: url('/assets/icons/link.png');
    mask-image: url('/assets/icons/link.png');
}

.smurdy-page-share-actions button[data-share-action="x"]::before {
    background-image: url('/assets/icons/x_logo.png');
}

.smurdy-page-share-actions button[data-share-action="facebook"]::before {
    background-image: url('/assets/icons/facebook_logo.png');
}

.smurdy-page-share-actions button[data-share-action="reddit"]::before {
    background-image: url('/assets/icons/reddit_logo.png');
}

.smurdy-page-share-actions button[data-share-action="email"]::before {
    -webkit-mask-image: url('/assets/icons/mail.png');
    mask-image: url('/assets/icons/mail.png');
}

html[data-smurdy-theme="dark"] body .smurdy-page-share-actions button[data-share-action="x"]::before {
    filter: invert(1);
}
'''
          share_css.write_text(s)

          # Give the changed share stylesheet its own cache key without changing social-image URLs or share.js.
          p = Path('tools/apply_sharing.js')
          s = p.read_text()
          assert 'const ASSET_VERSION = "20260914-sharing-7";' in s
          assert 'const SHARE_STYLE_VERSION' not in s
          s = s.replace(
              'const ASSET_VERSION = "20260914-sharing-7";',
              'const ASSET_VERSION = "20260914-sharing-7";\nconst SHARE_STYLE_VERSION = "20260917-icons-1";',
              1
          )
          s = s.replace(
              'href="/styles/share.css?v=${ASSET_VERSION}"',
              'href="/styles/share.css?v=${SHARE_STYLE_VERSION}"',
              1
          )
          p.write_text(s)

          # Cache-bust the homepage-only browser icon stylesheet.
          replace_once(
              'index.html',
              '/styles/browser_hierarchy.css?v=20260910-single-separator-1',
              '/styles/browser_hierarchy.css?v=20260917-icons-1'
          )

          # Regression coverage: every current icon asset must have a real runtime reference.
          Path('tests/icon_assets.test.js').write_text(r'''const test = require("node:test");
const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");

const root = path.resolve(__dirname, "..");
const read = relative => fs.readFileSync(path.join(root, relative), "utf8");

test("every current UI icon is wired into the runtime styles", () => {
    const iconNames = [
        "clock.png",
        "crosshair.png",
        "down_arrow.png",
        "facebook_logo.png",
        "link.png",
        "mail.png",
        "moon.png",
        "reddit_logo.png",
        "share.png",
        "sun.png",
        "up_arrow.png",
        "x_logo.png"
    ];
    const source = [
        read("styles/browser_hierarchy.css"),
        read("styles/share.css"),
        read("styles/theme.css")
    ].join("\n");

    for (const iconName of iconNames) {
        assert.equal(
            fs.existsSync(path.join(root, "assets", "icons", iconName)),
            true,
            `${iconName} is missing`
        );
        assert.ok(
            source.includes(`/assets/icons/${iconName}`),
            `${iconName} is not used by the UI`
        );
    }
});

test("new utility icons are attached to their intended controls", () => {
    const browser = read("styles/browser_hierarchy.css");
    const share = read("styles/share.css");

    assert.match(browser, /data-library-view="recent"[\s\S]*clock\.png/);
    assert.match(browser, /weak-spots-menu-button[\s\S]*crosshair\.png/);
    assert.match(browser, /qb-mobile-collapse-arrow[\s\S]*up_arrow\.png/);
    assert.match(browser, /qb-mobile-collapsed[\s\S]*down_arrow\.png/);
    assert.match(share, /data-share-action="copy"[\s\S]*link\.png/);
    assert.match(share, /data-share-action="email"[\s\S]*mail\.png/);
    assert.match(share, /data-share-action="x"[\s\S]*x_logo\.png/);
    assert.match(share, /data-share-action="facebook"[\s\S]*facebook_logo\.png/);
    assert.match(share, /data-share-action="reddit"[\s\S]*reddit_logo\.png/);
});
''')
          PY
      - name: Refresh public share stylesheet references
        run: |
          node tools/apply_sharing.js
          git checkout origin/main -- 1313 4824 8 archive bouvet fields jailtime overlap turnover tps
      - name: Validate
        run: |
          node --check src/js/app_core.js
          node --check tools/apply_sharing.js
          node -e 'JSON.parse(require("fs").readFileSync("src/data/app_version.json", "utf8"))'
          npm test
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/icon-rollout-1-16-10.yml package-lock.json
          git add -A
          git config user.name Smurdy
          git config user.email 110361649+Smurdy1@users.noreply.github.com
          git commit -m "Use the new UI icons"
          git push origin HEAD:polish/1.16.10-icon-rollout
