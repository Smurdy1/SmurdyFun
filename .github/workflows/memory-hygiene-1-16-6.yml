name: Memory hygiene 1.16.6
on:
  push:
    branches: [fix/1.16.6-memory-hygiene]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.16.6-memory-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply memory fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # Share UI: break a self-sustaining MutationObserver -> rAF -> class mutation loop,
          # and stop observing attribute changes across the entire MapLibre DOM.
          share = Path("src/js/share.js")
          s = share.read_text()
          old_mount = '''    function mountTrigger(trigger) {\n        if (!trigger?.isConnected && !document.body) return;\n        const mount = resolveTriggerMount();\n        if (!mount?.host) return;\n        trigger.className = `smurdy-page-share-trigger smurdy-page-share-trigger--${mount.variant}`;\n        if (trigger.parentNode !== mount.host) mount.host.appendChild(trigger);\n    }\n'''
          new_mount = '''    function mountTrigger(trigger) {\n        if (!trigger?.isConnected && !document.body) return;\n        const mount = resolveTriggerMount();\n        if (!mount?.host) return;\n        const desiredClassName = `smurdy-page-share-trigger smurdy-page-share-trigger--${mount.variant}`;\n        // Setting className to the value it already has still creates an attribute\n        // mutation in browsers. Because the share observer reacts on animation frames,\n        // an unconditional write here could keep the observer alive forever.\n        if (trigger.className !== desiredClassName) trigger.className = desiredClassName;\n        if (trigger.parentNode !== mount.host) mount.host.appendChild(trigger);\n    }\n'''
          if old_mount not in s:
              raise SystemExit("share mount block missing")
          s = s.replace(old_mount, new_mount, 1)

          observer_anchor = '''        let mountQueued = false;\n        const queueMount = () => {\n            if (mountQueued) return;\n            mountQueued = true;\n            requestAnimationFrame(() => {\n                mountQueued = false;\n                removeDuplicateTriggers(trigger);\n                mountTrigger(trigger);\n            });\n        };\n        state.observer = new MutationObserver(queueMount);\n        state.observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "aria-hidden", "style", "class"] });\n        window.addEventListener("resize", queueMount);\n'''
          observer_replacement = '''        let mountQueued = false;\n        const queueMount = () => {\n            if (mountQueued) return;\n            mountQueued = true;\n            requestAnimationFrame(() => {\n                mountQueued = false;\n                removeDuplicateTriggers(trigger);\n                mountTrigger(trigger);\n            });\n        };\n\n        // Only visibility changes on the handful of elements that can become a\n        // share-button host matter. Observing class/style changes across the whole\n        // body also observes MapLibre's internal DOM and used to let our own\n        // trigger.className write re-queue this callback every frame.\n        const visibilityHostSelector = [\n            "#quiz-browser",\n            "[data-flag-game]",\n            "#quiz-panel",\n            "[data-smurdy-quiz-actions]"\n        ].join(",");\n        const structureSelector = [\n            visibilityHostSelector,\n            "#qb-header",\n            ".flag-game-title-row",\n            ".panel-brand",\n            ".site-header-inner",\n            ".directory-shell",\n            ".directory-breadcrumbs",\n            "main"\n        ].join(",");\n\n        const nodeTouchesMountStructure = node => Boolean(\n            node &&\n            node.nodeType === 1 &&\n            (node.matches?.(structureSelector) || node.querySelector?.(structureSelector))\n        );\n\n        const observeVisibilityHosts = () => {\n            document.querySelectorAll(visibilityHostSelector).forEach(host => {\n                state.observer.observe(host, {\n                    attributes: true,\n                    attributeFilter: ["hidden", "aria-hidden", "style", "class"]\n                });\n            });\n        };\n\n        state.observer = new MutationObserver(mutations => {\n            let relevant = false;\n            for (const mutation of mutations) {\n                if (mutation.type === "attributes") {\n                    // Attribute records can only come from explicitly observed hosts.\n                    relevant = true;\n                    break;\n                }\n                if (mutation.type !== "childList") continue;\n                if (mutation.target?.matches?.(structureSelector)) {\n                    relevant = true;\n                    break;\n                }\n                const nodes = [\n                    ...Array.from(mutation.addedNodes || []),\n                    ...Array.from(mutation.removedNodes || [])\n                ];\n                if (nodes.some(nodeTouchesMountStructure)) {\n                    relevant = true;\n                    break;\n                }\n            }\n            if (!relevant) return;\n            observeVisibilityHosts();\n            queueMount();\n        });\n        state.observer.observe(document.body, { childList: true, subtree: true });\n        observeVisibilityHosts();\n        window.addEventListener("resize", queueMount);\n'''
          if observer_anchor not in s:
              raise SystemExit("share observer block missing")
          s = s.replace(observer_anchor, observer_replacement, 1)
          share.write_text(s)

          # Put a hard tile-count ceiling on both MapLibre instances in addition to
          # the existing two-zoom-level dynamic cache limit.
          app = Path("src/js/app_core.js")
          s = app.read_text()
          primary = '''    // Retain only two viewport zoom levels of tiles per source instead of MapLibre's default five.\n    maxTileCacheZoomLevels: 2,\n'''
          primary_new = '''    // Retain only two viewport zoom levels of tiles per source instead of MapLibre's default five.\n    maxTileCacheZoomLevels: 2,\n    // Also place an absolute ceiling on old tiles retained per source.\n    maxTileCacheSize: 64,\n'''
          if primary not in s:
              raise SystemExit("primary map cache block missing")
          s = s.replace(primary, primary_new, 1)
          menu = '''                // The menu map is temporary, so keep its retained tile window small.\n                maxTileCacheZoomLevels: 2,\n'''
          menu_new = '''                // The menu map is temporary, so keep its retained tile window small.\n                maxTileCacheZoomLevels: 2,\n                maxTileCacheSize: 64,\n'''
          if menu not in s:
              raise SystemExit("menu map cache block missing")
          s = s.replace(menu, menu_new, 1)

          # Release the temporary homepage map (workers + WebGL + tiles) while a tab
          # is backgrounded, then rebuild it when the user comes back to the homepage.
          visibility_anchor = '''window.SmurdyQuiz = SmurdyQuiz;\n \n// Start the independent menu map immediately instead of waiting for the quiz\n'''
          visibility_code = '''window.SmurdyQuiz = SmurdyQuiz;\n\n// The homepage uses a second, decorative MapLibre instance. When the tab is hidden\n// there is no reason to retain its workers, tile cache, or WebGL resources. Map.remove()\n// explicitly releases those resources; rebuild the decoration only if the user returns\n// while still on the homepage.\nlet menuMapSuspendedForVisibility = false;\nfunction currentLocationUsesMenuMap() {\n    try {\n        const path = String(location.pathname || "/").replace(/\\/+$/, "") || "/";\n        return (path === "/" || path === "/index.html") &&\n            !new URLSearchParams(location.search).has("quiz");\n    } catch (_) {\n        return false;\n    }\n}\n\ndocument.addEventListener("visibilitychange", () => {\n    if (document.hidden) {\n        if (SmurdyQuiz._menuActive && SmurdyQuiz._menuMap) {\n            menuMapSuspendedForVisibility = true;\n            try { SmurdyQuiz.hideMainMenuMap(); } catch (_) {}\n        }\n        return;\n    }\n\n    if (!menuMapSuspendedForVisibility) return;\n    menuMapSuspendedForVisibility = false;\n    if (!currentLocationUsesMenuMap()) return;\n    requestAnimationFrame(() => {\n        try { SmurdyQuiz.showMainMenuMap(); } catch (_) {}\n    });\n});\n \n// Start the independent menu map immediately instead of waiting for the quiz\n'''
          if visibility_anchor not in s:
              raise SystemExit("menu visibility insertion anchor missing")
          s = s.replace(visibility_anchor, visibility_code, 1)

          s = s.replace('const APP_VERSION = "1.16.5";', 'const APP_VERSION = "1.16.6";', 1)
          app.write_text(s)

          # Cache-bust the files changed above.
          replace_once(
              "src/js/app.js",
              'const ASSET_VERSION = "20260910-suggestions-1";',
              'const ASSET_VERSION = "20260916-memory-2";'
          )
          replace_once(
              "src/js/app.js",
              'loadScript("/src/js/app_core.js?v=20260916-small-fixes-1", function() {',
              'loadScript("/src/js/app_core.js?v=20260916-memory-2", function() {'
          )

          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              text = p.read_text()
              if '/src/js/share.js?v=20260914-sharing-7' in text:
                  p.write_text(text.replace(
                      '/src/js/share.js?v=20260914-sharing-7',
                      '/src/js/share.js?v=20260916-memory-2'
                  ))

          # Regression coverage for the actual leak mechanism and map resource ceilings.
          runtime = Path("tests/runtime_memory.test.js")
          s = runtime.read_text()
          s = s.replace(
              'assert.match(read("src/js/app_core.js"), /const APP_VERSION = "1\\.16\\.5";/);',
              'assert.match(read("src/js/app_core.js"), /const APP_VERSION = "1\\.16\\.6";/);',
              1
          )
          s += '''\n\ntest("share remount observer cannot self-sustain through its own class mutation", () => {\n    const source = read("src/js/share.js");\n    assert.match(source, /if \\(trigger\\.className !== desiredClassName\\) trigger\\.className = desiredClassName/);\n    assert.doesNotMatch(source, /observe\\(document\\.body, \\{ childList: true, subtree: true, attributes: true/);\n    assert.match(source, /state\\.observer\\.observe\\(document\\.body, \\{ childList: true, subtree: true \\}\\)/);\n    assert.match(source, /observeVisibilityHosts\\(\\)/);\n});\n\ntest("both MapLibre maps cap retained tiles and background homepage releases its temporary map", () => {\n    const source = read("src/js/app_core.js");\n    assert.ok((source.match(/maxTileCacheSize: 64/g) || []).length >= 2);\n    assert.match(source, /document\\.addEventListener\\("visibilitychange"/);\n    assert.match(source, /SmurdyQuiz\\.hideMainMenuMap\\(\\)/);\n    assert.match(source, /menuMapSuspendedForVisibility/);\n});\n'''
          runtime.write_text(s)

          # Other version assertions.
          for file in ["tests/editorial_identity.test.js"]:
              p = Path(file)
              text = p.read_text().replace('1\\.16\\.5', '1\\.16\\.6')
              p.write_text(text)
          PY
      - name: Install dependencies
        run: npm install
      - name: Validate
        run: |
          node --check src/js/share.js
          node --check src/js/app_core.js
          node --check src/js/app.js
          npm test
          git diff --check
      - name: Commit release
        run: |
          rm .github/workflows/memory-hygiene-1-16-6.yml
          git add -A
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git commit -m "Fix long-session memory growth"
          git push origin HEAD:fix/1.16.6-memory-hygiene
