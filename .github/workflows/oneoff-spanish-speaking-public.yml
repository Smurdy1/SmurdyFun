name: One-off Spanish-speaking public group build

on:
  push:
    branches:
      - feature/spanish-speaking-public-group

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spanish-speaking-public-group
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate public quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-08'
        run: npm run pages:generate

      - name: Check JavaScript syntax
        run: |
          node --check src/js/capital_quiz.js
          node --check src/js/manifest.js
          node --check src/js/flag_catalog.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js

      - name: Run Spanish-speaking and full tests
        run: |
          node --test tests/spanish_speaking.test.js
          npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated public pages
        run: |
          rm -f .github/workflows/oneoff-spanish-speaking-public.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add public Spanish-speaking quiz pages"
          git push origin HEAD:feature/spanish-speaking-public-group
