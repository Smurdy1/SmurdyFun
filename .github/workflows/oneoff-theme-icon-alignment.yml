name: Finalize compact theme toggle

on:
  push:
    branches:
      - feature/theme-icon-toggle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theme-icon-toggle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply alignment refinements
        run: node tools/tmp_theme_icon_alignment.js
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check JavaScript
        run: node --check src/js/theme.js
      - name: Run tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Clean helper files and commit
        run: |
          rm tools/tmp_theme_icon_alignment.js
          rm .github/workflows/oneoff-theme-icon-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish sun and moon theme toggle" || exit 0
          git push
