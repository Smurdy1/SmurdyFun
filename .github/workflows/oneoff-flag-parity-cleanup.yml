name: One-off flag parity cleanup

on:
  push:
    branches:
      - codex/flag-parity-foundations

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flag-parity-foundations
          fetch-depth: 0

      - name: Remove temporary build artifacts
        run: |
          rm -rf node_modules
          rm -f .github/workflows/oneoff-flag-parity-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary parity build artifacts"
          git push origin HEAD:codex/flag-parity-foundations
