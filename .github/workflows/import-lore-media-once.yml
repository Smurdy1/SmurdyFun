name: Import original lore media once

on:
  push:
    branches:
      - remove-redrawn-lore-svgs-cleanup
    paths:
      - .github/workflows/import-lore-media-once.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-redrawn-lore-svgs-cleanup
          fetch-depth: 0

      - name: Download the user-provided source document and audio
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d7d0-81f5-aaad-b180b2ec8a7d/raw?se=2026-09-15T21%3A24%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=06952f94-826f-5f8b-b17f-ce2da6f4c6c7&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A09%3A43Z&ske=2026-09-16T19%3A09%3A43Z&sks=b&skv=2026-02-06&sig=0UEUlz8yIYsXxW5xPOSjJRATGNmDcm66DlCtoOtQjIE%3D' -o /tmp/smurdy-ideas.docx
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ff5c-81f5-a54e-d1fa6654275f/raw?se=2026-09-15T21%3A24%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=e9f2050d-2a9c-5af3-875c-005028e8f27b&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A20%3A17Z&ske=2026-09-16T19%3A20%3A17Z&sks=b&skv=2026-02-06&sig=y917deMDM9EqeS%2Bxx0posJm10WqBS4n69qjTmhLYdz0%3D' -o /tmp/trombone.wav
          rm -rf /tmp/smurdy-ideas
          mkdir -p /tmp/smurdy-ideas
          unzip -q /tmp/smurdy-ideas.docx -d /tmp/smurdy-ideas
          test -f /tmp/smurdy-ideas/word/media/image28.jpg
          test -s /tmp/trombone.wav

      - name: Replace lore visuals with the user's originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/lore
          find assets/lore -maxdepth 1 -type f ! -name 'archive-5729.txt' -delete
          m=/tmp/smurdy-ideas/word/media
          cp "$m/image1.png"  assets/lore/eye-bars.png
          cp "$m/image2.png"  assets/lore/overlap.png
          cp "$m/image3.png"  assets/lore/cat-dark.png
          cp "$m/image4.png"  assets/lore/eye-normal-a.png
          cp "$m/image5.png"  assets/lore/eye-empty.png
          cp "$m/image6.png"  assets/lore/turnover.png
          cp "$m/image7.png"  assets/lore/tps.png
          cp "$m/image8.png"  assets/lore/tree.png
          cp "$m/image9.png"  assets/lore/sign.png
          cp "$m/image10.png" assets/lore/forsaken8.png
          cp "$m/image11.png" assets/lore/eye-batman.png
          cp "$m/image12.png" assets/lore/jailtime.png
          cp "$m/image13.png" assets/lore/cat-box.png
          cp "$m/image14.png" assets/lore/hyper-dark.png
          cp "$m/image15.png" assets/lore/cat-window.png
          cp "$m/image16.png" assets/lore/since-1984.png
          cp "$m/image17.png" assets/lore/faucet-fan.png
          cp "$m/image18.png" assets/lore/road.png
          cp "$m/image19.png" assets/lore/eye-outline.png
          cp "$m/image20.png" assets/lore/route-4824.png
          cp "$m/image21.png" assets/lore/bouvet.png
          cp "$m/image22.png" assets/lore/eye-offset.png
          cp "$m/image23.png" assets/lore/pumpkin.png
          cp "$m/image24.png" assets/lore/old-map.png
          cp "$m/image25.png" assets/lore/pixel-creature.png
          cp "$m/image26.png" assets/lore/eye-red.png
          cp "$m/image27.png" assets/lore/eye-normal-b.png
          cp "$m/image28.jpg" assets/lore/purple-shadow.jpg
          cp /tmp/trombone.wav assets/lore/trombone.wav

      - name: Commit imported media and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/import-lore-media-once.yml
          git config user.name 'Smurdy'
          git config user.email '110361649+Smurdy1@users.noreply.github.com'
          git add -A assets/lore
          git commit -m '1.16.1 Replace lore visuals with original user artifacts'
          git push origin HEAD:remove-redrawn-lore-svgs-cleanup
