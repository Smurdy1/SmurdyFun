name: One-off dark mode implementation

on:
  push:
    branches:
      - feature/dark-mode

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dark-mode
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add main-menu theme toggle
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');
          if (!html.includes('data-smurdy-theme-toggle')) {
            const needle = '                 <a href="https://forms.gle/XjJoHBNKSrHLWg1h9" target="_blank" rel="noopener">Feedback</a>';
            if (!html.includes(needle)) throw new Error('Could not find homepage links insertion point');
            html = html.replace(
              needle,
              needle + '\n                 <button type="button" class="smurdy-theme-toggle" data-smurdy-theme-toggle aria-pressed="false">Dark mode</button>'
            );
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate public pages
        env:
          SITEMAP_LASTMOD: 2026-09-11
        run: npm run pages:generate

      - name: JavaScript syntax checks
        run: |
          node --check src/js/theme.js
          node --check tools/apply_sharing.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit implementation and generated pages
        run: |
          rm .github/workflows/oneoff-dark-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add persistent dark mode"
          git push origin HEAD:feature/dark-mode
