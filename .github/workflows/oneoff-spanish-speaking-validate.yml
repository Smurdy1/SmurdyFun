name: Validate public Spanish-speaking group

on:
  push:
    branches:
      - feature/spanish-speaking-public-group

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spanish-speaking-public-group
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-08'
        run: npm run pages:generate
      - name: Check syntax
        run: |
          node --check src/js/capital_quiz.js
          node --check src/js/manifest.js
          node --check src/js/flag_catalog.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
      - name: Run tests
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit generated state
        run: |
          rm -f .github/workflows/oneoff-spanish-speaking-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize public Spanish-speaking quiz group"
            git push origin HEAD:feature/spanish-speaking-public-group
          fi
