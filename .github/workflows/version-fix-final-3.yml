name: Finish version badge fix
on:
  push:
    branches: [fix/1.16.9-version-badge]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.16.9-version-badge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          workflow = Path('.github/workflows/version-fix-final-2.yml').read_text()
          match = re.search(r"run: echo '([^']+)' \| base64 -d \| python", workflow)
          assert match, 'Could not find embedded source patch'
          source = base64.b64decode(match.group(1)).decode('utf-8')
          exec(compile(source, '<version-fix>', 'exec'))
          PY
      - name: Refresh assertions changed by current main copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/lore_system.test.js')
          s = p.read_text()
          assert '20260916-lore-4' in s
          p.write_text(s.replace('20260916-lore-4', '20260916-version-1'))

          p = Path('tests/trust_pages.test.js')
          s = p.read_text()
          replacements = {
              'Flag quizzes for the world, regions, specialty groups, and US states': 'Flag quizzes for the world and US states',
              'It started as a map quiz I wanted to play': 'It started as a map quiz I made to teach myself geography',
              'I like geography and programming': "I'm quite a big fan of geography and programming",
              'people also send useful corrections': 'people also regularly send useful corrections and really cool ideas'
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check src/js/app_core.js
          node --check src/js/lore.js
          node --check src/js/app.js
          node --check src/js/quiz_session.js
          node -e 'JSON.parse(require("fs").readFileSync("src/data/app_version.json","utf8"))'
          npm test
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/version-badge-1-16-9.yml \
                .github/workflows/version-fix-final.yml \
                .github/workflows/version-fix-final-2.yml \
                .github/workflows/version-fix-final-3.yml \
                package-lock.json
          git add -A
          git config user.name Smurdy
          git config user.email 110361649+Smurdy1@users.noreply.github.com
          git commit -m "Fix stale version badge updates"
          git push origin HEAD:fix/1.16.9-version-badge
