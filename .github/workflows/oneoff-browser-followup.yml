name: One-off 1.14.3 browser hierarchy validation

on:
  push:
    branches:
      - polish/browser-hierarchy-followup

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/browser-hierarchy-followup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-10'
        run: npm run pages:generate

      - name: Check JavaScript syntax
        run: |
          node --check tools/quiz_page_shell.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
          node --check src/js/browse.js
          node --check src/js/app_core.js
          node --check src/js/quiz_runner.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated pages
        run: |
          rm -f .github/workflows/oneoff-browser-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.14.3: Regenerate simplified landing pages"
          git push origin HEAD:polish/browser-hierarchy-followup
