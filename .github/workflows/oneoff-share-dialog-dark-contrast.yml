name: Fix share dialog dark contrast

on:
  push:
    branches:
      - fix/share-dialog-dark-contrast

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-dialog-dark-contrast
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 tools/oneoff_share_dialog_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate pages
        env:
          SITEMAP_LASTMOD: 2026-09-14
        run: npm run pages:generate
      - name: Validate
        run: |
          node --check tools/apply_sharing.js
          npm test
          git diff --check
      - name: Commit result
        run: |
          rm .github/workflows/oneoff-share-dialog-dark-contrast.yml
          rm tools/oneoff_share_dialog_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Share dialog contrast in dark mode"
          git push origin HEAD:fix/share-dialog-dark-contrast
