name: Finish lore SVG cleanup

on:
  push:
    branches:
      - remove-redrawn-lore-svgs

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message != 'Finish lore asset cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-redrawn-lore-svgs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch cleanup safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text)

          lore = Path("src/js/lore.js")
          text = lore.read_text()
          text = text.replace('const RELEASE_VERSION = "1.16.0";', 'const RELEASE_VERSION = "1.16.2";')
          old_style = '            .smurdy-lore-eye-react{transform:translateX(2px) rotate(-2deg)!important;opacity:.72!important}\n'
          new_style = old_style + '            .smurdy-lore-eye-reverse{transform:scaleX(-1)!important}\n'
          if old_style not in text:
              raise SystemExit("Runtime lore style hook not found")
          text = text.replace(old_style, new_style, 1)
          old_fn = '''    function replaceEyeWithReverse() {\n        const eye = brandEye();\n        if (!eye) return false;\n        if (!eye.dataset.smurdyLoreOriginalSrc) eye.dataset.smurdyLoreOriginalSrc = eye.getAttribute("src") || "";\n        eye.src = "/assets/lore/turnover-reverse.svg";\n        eye.alt = "";\n        setState({ seen_eye_variant: true });\n        return true;\n    }'''
          new_fn = '''    function replaceEyeWithReverse() {\n        const eye = brandEye();\n        if (!eye) return false;\n        eye.classList.add("smurdy-lore-eye-reverse");\n        setState({ seen_eye_variant: true });\n        return true;\n    }'''
          if old_fn not in text:
              raise SystemExit("Reverse-eye function did not match expected source")
          text = text.replace(old_fn, new_fn, 1)
          text = text.replace('artifact("/assets/lore/turnover-reverse.svg")', 'artifact("/assets/images/smurdeye-transparent.png?v=20260825-logo-1")', 1)
          lore.write_text(text)

          replace("src/js/app_core.js", 'const APP_VERSION = "1.15.0";', 'const APP_VERSION = "1.16.2";', 1)

          cache_files = [
              "index.html", "src/js/quiz_session.js",
              "turnover/index.html", "jailtime/index.html", "8/index.html", "4824/index.html",
              "1313/index.html", "bouvet/index.html", "tps/index.html", "overlap/index.html",
              "archive/index.html", "fields/index.html"
          ]
          for name in cache_files:
              p = Path(name)
              s = p.read_text()
              if "lore.js?v=" not in s:
                  raise SystemExit(f"Lore script reference missing from {name}")
              import re
              s, n = re.subn(r'lore\.js\?v=20260914-lore-[12]', 'lore.js?v=20260915-lore-3', s)
              if n == 0:
                  raise SystemExit(f"Expected old lore cache key missing from {name}")
              p.write_text(s)

          p = Path("tests/lore_system.test.js")
          s = p.read_text()
          s = s.replace('assert.equal(lore.RELEASE_VERSION, "1.16.0");', 'assert.equal(lore.RELEASE_VERSION, "1.16.2");')
          s = s.replace('lore\\.js\\?v=20260914-lore-2', 'lore\\.js\\?v=20260915-lore-3')
          anchor = '''test("turnover poem text and inside-code vocabulary are preserved", () => {'''
          regression = '''test("redrawn lore SVGs stay removed and live lore uses original assets", () => {\n    const source = read("src/js/lore.js");\n    const removed = [\n        "empty-eye.svg", "encryption.svg", "eye-bars.svg", "eye-offset.svg",\n        "eye-signal.svg", "forsaken8-box.svg", "forsaken8.svg", "turnover-reverse.svg"\n    ];\n    for (const file of removed) {\n        assert.equal(fs.existsSync(path.join(__dirname, "..", "assets", "lore", file)), false, file);\n    }\n    assert.doesNotMatch(source, /\\/assets\\/lore\\/[^"']+\\.svg/);\n    assert.match(source, /smurdeye-transparent\\.png/);\n    assert.match(source, /smurdy-lore-eye-reverse/);\n});\n\n'''
          if anchor not in s:
              raise SystemExit("Lore test insertion anchor missing")
          s = s.replace(anchor, regression + anchor, 1)
          p.write_text(s)

          for test_file in ["tests/runtime_memory.test.js", "tests/editorial_identity.test.js"]:
              p = Path(test_file)
              s = p.read_text()
              if '1\\.15\\.0' not in s:
                  raise SystemExit(f"Expected version assertion missing from {test_file}")
              p.write_text(s.replace('1\\.15\\.0', '1\\.16\\.2'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check src/js/lore.js
          node --check src/js/app_core.js
          node --check src/js/quiz_session.js
      - name: Run tests
        run: npm test
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit finished cleanup
        run: |
          rm .github/workflows/finish-lore-svg-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git add -A
          git commit -m "Finish lore asset cleanup"
          git push origin HEAD:remove-redrawn-lore-svgs
