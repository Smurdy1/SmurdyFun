name: Place Weak Spots mode beside name

on:
  push:
    branches:
      - codex/mode-specific-weak-spots

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[weak-spots-layout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mode-specific-weak-spots
          fetch-depth: 0

      - name: Apply layout edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/js/weak_spots.js')
          text = path.read_text()

          name_pattern = re.compile(
              r"'<div class=\"weak-spot-name\">' \+ escapeHtml\(entry\.name\) \+ \"</div>\" \+"
          )
          name_replacement = (
              "'<div class=\"weak-spot-name\">' +\n"
              "                        escapeHtml(entry.name) + \" · \" + escapeHtml(modeLabel(entry.mode)) +\n"
              "                    \"</div>\" +"
          )
          text, name_count = name_pattern.subn(name_replacement, text, count=1)

          meta_pattern = re.compile(
              r"'<div class=\"weak-spot-meta\">' \+ escapeHtml\(modeLabel\(entry\.mode\)\) \+ \"</div>\" \+"
          )
          meta_replacement = (
              "'<div class=\"weak-spot-meta\">' +\n"
              "                        Number(entry.misses || 0) + \" \" +\n"
              "                        (Number(entry.misses) === 1 ? \"miss\" : \"misses\") +\n"
              "                    \"</div>\" +"
          )
          text, meta_count = meta_pattern.subn(meta_replacement, text, count=1)

          if name_count != 1 or meta_count != 1:
              raise SystemExit(f'layout replacements: name={name_count}, meta={meta_count}')

          path.write_text(text)

          workflow = Path('.github/workflows/oneoff-weak-spots-layout.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit edit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Place Weak Spots mode beside name [weak-spots-layout]"
          git push origin HEAD:codex/mode-specific-weak-spots
