name: One-off smurdyTest hardening

on:
  push:
    branches:
      - harden/smurdy-test-tools

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: harden/smurdy-test-tools
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply test-tool hardening
        run: python3 tools/oneoff_test_tools_patch.py

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate pages
        env:
          SITEMAP_LASTMOD: 2026-09-10
        run: npm run pages:generate

      - name: JavaScript syntax checks
        run: |
          node --check src/js/test_tools.js
          node --check src/js/quiz_runner.js
          node --check src/js/flag_quiz.js
          node --check src/js/analytics.js
          node --check src/js/quiz_completion.js
          node --check src/js/weak_spots.js
          node --check src/js/quiz_library.js
          node --check src/js/quiz_landing.js
          node --check src/js/app.js
          node --check src/js/app_core.js
          node --check tools/quiz_page_shell.js
          node --check tools/generate_flag_pages.js
          node --check tools/generate_quiz_pages.js

      - name: Run tests
        run: npm test

      - name: Validate whitespace
        run: git diff --check

      - name: Commit validated hardening
        shell: bash
        run: |
          rm -f tools/oneoff_test_tools_patch.py .github/workflows/oneoff-test-tools-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden statless smurdyTest shortcuts"
          git push origin HEAD:harden/smurdy-test-tools
