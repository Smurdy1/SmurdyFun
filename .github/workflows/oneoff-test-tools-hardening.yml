const path = require("node:path");
const test = require("node:test");
const assert = require("node:assert/strict");
const { createSmurdyTestTools } = require("../src/js/test_tools.js");

function storage() {
    const values = new Map();
    return {
        getItem(key) { return values.has(key) ? values.get(key) : null; },
        setItem(key, value) { values.set(key, String(value)); },
        removeItem(key) { values.delete(key); }
    };
}

function rootFor(url) {
    const parsed = new URL(url);
    return {
        sessionStorage: storage(),
        location: {
            hostname: parsed.hostname,
            search: parsed.search,
            href: parsed.href
        }
    };
}

const repoRoot = path.resolve(__dirname, "..");
const read = file => fs.readFileSync(path.join(repoRoot, file), "utf8");

test("production query strings cannot activate test shortcuts by themselves", () => {
    const root = rootFor("https://smurdy.fun/quizzes/type-country/world/?smurdyTest=last-answer");
    const tools = createSmurdyTestTools(root);
    assert.equal(tools.getRequestedMode(), "");
    assert.equal(tools.capture().active, false);
    assert.equal(tools.isStatless(), false);
});

test("localhost accepts recognized test modes but ignores unknown ones", () => {
    const local = createSmurdyTestTools(rootFor("http://localhost:8000/quizzes/type-country/world/?smurdyTest=last-answer"));
    assert.equal(local.capture().mode, "last-answer");
    assert.equal(local.isStatless(), true);

    const unknown = createSmurdyTestTools(rootFor("http://localhost:8000/?smurdyTest=instant-win"));
    assert.equal(unknown.getRequestedMode(), "");
    assert.equal(unknown.capture().active, false);
    assert.equal(unknown.isStatless(), false);
});

test("explicit production opt-in works and a captured test stays statless", () => {
    const root = rootFor("https://smurdy.fun/quizzes/find-point/world/?smurdyTest=review");
    const tools = createSmurdyTestTools(root);
    tools.enable();
    const run = tools.capture();
    assert.equal(run.mode, "review");
    assert.equal(run.statless, true);

    root.location.search = "";
    tools.disable();
    assert.equal(tools.isStatless(), true);
    assert.equal(tools.capture(), run);
});

test("last-answer scenario leaves exactly the current item unfinished", () => {
    const tools = createSmurdyTestTools(rootFor("http://localhost/?smurdyTest=last-answer"));
    const run = tools.capture();
    const items = [{ id: "a", name: "A" }, { id: "b", name: "B" }, { id: "c", name: "C" }];
    const scenario = run.buildScenario(items, items[1], {
        keyOf: item => item.id,
        nameOf: item => item.name,
        itemLabel: "flag"
    });
    assert.equal(scenario.complete, false);
    assert.equal(scenario.seed.total, 3);
    assert.deepEqual(scenario.seed.completedItems.map(item => item.id), ["a", "c"]);
    assert.equal(scenario.message, "Test mode: answer this final flag.");
});

test("review scenario is renderer-neutral and preserves flag review data", () => {
    const tools = createSmurdyTestTools(rootFor("http://localhost/?smurdyTest=review"));
    const run = tools.capture();
    const items = [
        { id: "a", name: "A", src: "/a.svg" },
        { id: "b", name: "B", src: "/b.svg" },
        { id: "c", name: "C", src: "/c.svg" },
        { id: "d", name: "D", src: "/d.svg" }
    ];
    const scenario = run.buildScenario(items, items[0], {
        keyOf: item => item.id,
        nameOf: item => item.name,
        dataOf: item => ({ src: item.src })
    });
    assert.equal(scenario.complete, true);
    assert.equal(scenario.seed.completedItems.length, 4);
    assert.equal(scenario.seed.misses.length, 3);
    assert.deepEqual(scenario.seed.misses.map(item => item.count), [1, 2, 3]);
    assert.equal(scenario.seed.misses[2].gaveUp, 1);
    assert.deepEqual(scenario.seed.misses[0].data, { src: "/a.svg" });
});

test("map, flag, analytics, Weak Spots, and recents all use the shared statless guard", () => {
    const mapRunner = read("src/js/quiz_runner.js");
    const flagRunner = read("src/js/flag_quiz.js");
    const analytics = read("src/js/analytics.js");
    const completion = read("src/js/quiz_completion.js");
    const weakSpots = read("src/js/weak_spots.js");
    const library = read("src/js/quiz_library.js");

    assert.match(mapRunner, /SmurdyTestTools\\?\\.capture/);
    assert.match(flagRunner, /SmurdyTestTools\\?\\.capture/);
    assert.match(flagRunner, /testRun\\.buildScenario\\(flags, currentFlag/);
    assert.match(flagRunner, /dataOf: flag => \\(\\{ src: flag\\?\\.src/);
    assert.match(analytics, /SmurdyTestTools\\?\\.isStatless/);
    assert.match(completion, /statlessTestRun/);
    assert.match(weakSpots, /testRunIsStatless/);
    assert.match(library, /suppressRecentWrites/);
});

test("generated quiz pages load test tools before quiz runtimes", () => {
    const mapPage = read("quizzes/click-country/world/index.html");
    const flagPage = read("quizzes/type-flag/world/index.html");
