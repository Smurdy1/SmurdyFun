name: One-off smurdyTest hardening

on:
  push:
    branches:
      - harden/smurdy-test-tools

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: harden/smurdy-test-tools
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply test-tool hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          # Map runner: only recognized, explicitly enabled test runs are active.
          replace_once(
              "src/js/quiz_runner.js",
              '''    // Exact opt-in shortcut for regression testing. It is never enabled during
    // normal play and its quiz events are excluded from analytics.
    const smurdyTestMode = (() => {
        try {
            return new URLSearchParams(window.location.search).get("smurdyTest") || "";
        } catch (_) {
            return "";
        }
    })();
    const lastAnswerTestMode = smurdyTestMode === "last-answer";
    const reviewTestMode = smurdyTestMode === "review";
    const anyTestMode = Boolean(smurdyTestMode);''',
              '''    // Test shortcuts are centrally authorized and captured for the full run.
    // Captured test runs stay statless even if the URL is edited mid-quiz.
    const testRun = window.SmurdyTestTools?.capture?.() || {
        mode: "",
        active: false,
        statless: false,
        buildScenario: () => null
    };
    const lastAnswerTestMode = testRun.mode === "last-answer";
    const reviewTestMode = testRun.mode === "review";
    const anyTestMode = Boolean(testRun.active);'''
          )
          replace_once(
              "src/js/quiz_runner.js",
              '''        disabled: () => anyTestMode''',
              '''        disabled: () => testRun.statless'''
          )
          replace_once(
              "src/js/quiz_runner.js",
              '''        if (!reviewTestMode) {''',
              '''        if (!testRun.statless) {'''
          )
          replace_once(
              "src/js/quiz_runner.js",
              '''        if (!retryWeakSpots || anyTestMode || !currentName || hadMiss) return;''',
              '''        if (!retryWeakSpots || testRun.statless || !currentName || hadMiss) return;'''
          )

          old_sequence = '''    function startQuestionSequence() {
        const questionPromise = nextQuestion();
        if (!lastAnswerTestMode && !reviewTestMode) return questionPromise;

        return Promise.resolve(questionPromise).then(() => {
            if (!currentName || quizSession.snapshot().completedCount > 0) return;

            if (reviewTestMode) {
                const names = getNames();
                quizSession.seed({
                    total: names.length,
                    completedItems: names,
                    misses: names.slice(0, Math.min(3, names.length)).map((name, index) => {
                        const displayName = getCanonicalDisplayName(name);
                        return {
                            key: normalizeName(displayName),
                            name: displayName,
                            count: index + 1,
                            guesses: [],
                            gaveUp: index === 2 ? 1 : 0,
                            item: name
                        };
                    }),
                    attempts: names.length + 3,
                    correctAnswers: names.length,
                    firstTryCorrect: Math.max(0, names.length - 3)
                });
                updateCounter();
                updateAccuracy();
                return nextQuestion();
            }

            const currentKey = normalizeName(currentName);
            quizSession.seed({
                total: getNames().length,
                completedItems: getNames().filter(name => normalizeName(name) !== currentKey),
                attempts: 0,
                correctAnswers: 0,
                firstTryCorrect: 0
            });
            repaintCompleted();
            updateCounter();
            updateAccuracy();
            SQ.setResultText("Test mode: answer this final place.");
        }).catch(error => {
            console.error("Could not prepare quiz test mode", error);
        });
    }'''
          new_sequence = '''    function startQuestionSequence() {
        const questionPromise = nextQuestion();
        if (!anyTestMode) return questionPromise;

        return Promise.resolve(questionPromise).then(() => {
            if (!currentName || quizSession.snapshot().completedCount > 0) return;

            const scenario = testRun.buildScenario(getNames(), currentName, {
                keyOf: name => normalizeName(getCanonicalDisplayName(name)),
                nameOf: name => getCanonicalDisplayName(name),
                itemLabel: "place"
            });
            if (!scenario?.seed) return;

            quizSession.seed(scenario.seed);
            updateCounter();
            updateAccuracy();

            if (scenario.complete) return nextQuestion();

            quizSession.setCurrent(currentName);
            repaintCompleted();
            SQ.setResultText(scenario.message || "Test mode: answer this final place.");
        }).catch(error => {
            console.error("Could not prepare quiz test mode", error);
        });
