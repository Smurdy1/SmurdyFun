name: Apply compact icon theme toggle

on:
  push:
    branches:
      - feature/theme-icon-toggle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theme-icon-toggle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply theme toggle changes
        run: node tools/tmp_theme_icon_toggle.js
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate pages
        run: SITEMAP_LASTMOD=2026-09-11 npm run pages:generate
      - name: Check JavaScript
        run: |
          node --check src/js/theme.js
          node --check tools/apply_sharing.js
      - name: Run tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Clean helper files and commit
        run: |
          rm tools/tmp_theme_icon_toggle.js
          rm .github/workflows/oneoff-theme-icon-toggle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use sun and moon icons for compact theme toggle"
          git push origin HEAD:feature/theme-icon-toggle
