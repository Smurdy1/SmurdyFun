name: One-off UI polish

on:
  push:
    branches:
      - ui/1.13.10-polish

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/1.13.10-polish
          fetch-depth: 0

      - name: Apply UI polish
        run: python tools/oneoff_ui_polish_1_13_10.py

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/js/manifest.js
          node --check src/js/quiz_runner.js
          node --check src/js/app_core.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit UI polish
        run: |
          rm -f .github/workflows/oneoff-ui-polish.yml tools/oneoff_ui_polish_1_13_10.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.13.10: Polish core UI details"
          git push origin HEAD:ui/1.13.10-polish
