name: One-off final quiz UI cleanup

on:
  push:
    branches:
      - refactor/final-quiz-unification

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-quiz-unification
          fetch-depth: 0

      - name: Remove mechanical center-dot separators from touched quiz UI
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'tools/generate_quiz_pages.js',
              'tools/generate_flag_pages.js',
              'src/js/browse.js'
          ]:
              path = Path(name)
              text = path.read_text()
              path.write_text(text.replace(' · ', ' / '))
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate pages
        env:
          SITEMAP_LASTMOD: '2026-09-03'
        run: npm run pages:generate

      - name: Validate
        run: |
          node --check src/js/browse.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
          npm test
          git diff --check
          ! grep -R " · " quizzes/click-country quizzes/type-country quizzes/find-country quizzes/find-point quizzes/click-subdivision quizzes/type-subdivision quizzes/find-subdivision quizzes/find-point-subdivision quizzes/type-flag --include='index.html'

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/oneoff-final-ui-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean unified quiz metadata separators"
          git push origin HEAD:refactor/final-quiz-unification
