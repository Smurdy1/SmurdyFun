name: One-off UI detail fix

on:
  push:
    branches:
      - fix/ui-badge-separator-spacing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ui-badge-separator-spacing
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: python3 tools/oneoff_ui_detail_patch.py
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Regenerate pages
        run: SITEMAP_LASTMOD=2026-09-10 npm run pages:generate
      - name: JavaScript syntax checks
        run: |
          node --check src/js/weak_spots.js
          node --check tests/ui_detail_regressions.test.js
      - name: Run tests
        run: npm test
      - name: Validate whitespace
        run: git diff --check
      - name: Commit validated fix
        run: |
          rm .github/workflows/oneoff-ui-detail-fix.yml
          rm tools/oneoff_ui_detail_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Weak Spots badge and landing dividers"
          git push origin HEAD:fix/ui-badge-separator-spacing
