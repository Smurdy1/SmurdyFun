name: Validate dark theme polish
on:
  push:
    branches: [fix/dark-mode-polish-v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --check src/js/theme.js
      - run: npm test
      - run: git diff --check origin/main...HEAD
