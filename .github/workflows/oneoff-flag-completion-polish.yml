name: Polish flag completion layout
on:
  push:
    branches: [polish/flag-completion-layout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'Smurdy1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/flag-completion-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/js/flag_quiz.js')
          s = p.read_text()
          s = s.replace(
              '            if (retry) retry.hidden = misses.length === 0;\n            if (afterActions) afterActions.hidden = false;',
              '            if (retry) retry.hidden = misses.length === 0;\n            game.classList.add("is-complete");\n            game.classList.toggle("has-misses", misses.length > 0);\n            if (afterActions) afterActions.hidden = false;'
          )
          s = s.replace(
              '            retryWeakSpots = Boolean(isWeakSpotsRetry);\n            removePracticeContinuation();',
              '            retryWeakSpots = Boolean(isWeakSpotsRetry);\n            game.classList.remove("is-complete", "has-misses");\n            removePracticeContinuation();'
          )
          p.write_text(s)

          p = Path('styles/flag_quiz.css')
          s = p.read_text()
          s = s.replace(
              '.flag-result.is-finished { color: var(--text); font-size: 20px; }\n.flag-game-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 8px; }\n.flag-summary, .flag-review { margin-top: 24px;',
              '.flag-result.is-finished { min-height: 0; margin-top: 10px; color: var(--text); font-size: 20px; }\n.flag-game-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 6px; }\n.flag-game.is-complete:not(.has-misses) .flag-game-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n.flag-summary, .flag-review { margin-top: 18px;'
          )
          s = s.replace(
              '.flag-after-actions { justify-content: center; }',
              '.flag-after-actions { margin-top: 16px; justify-content: center; }\n.flag-after-actions .flag-button { min-height: 38px; padding: 8px 12px; border-color: #d9dcdf; background: #fff; color: #444; font-size: 13px; font-weight: 650; }\n.flag-after-actions .flag-button:hover { border-color: #bcc1c5; background: #f7f8f8; }'
          )
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check src/js/flag_quiz.js
          npm test
          git diff --check
      - name: Commit edits
        run: |
          rm .github/workflows/oneoff-flag-completion-polish.yml
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git add -A
          git commit -m "Polish flag quiz completion screen"
          git push origin HEAD:polish/flag-completion-layout
