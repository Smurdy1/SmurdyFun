name: One-off Spanish Class build

on:
  push:
    branches:
      - feature/spanish-class-capitals

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spanish-class-capitals
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-08'
        run: npm run pages:generate

      - name: Check JavaScript syntax
        run: |
          node --check src/js/capital_quiz.js
          node --check tools/generate_quiz_pages.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated secret page
        run: |
          rm -f .github/workflows/oneoff-spanish-class-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hidden Spanish Class capitals quiz"
          git push origin HEAD:feature/spanish-class-capitals
