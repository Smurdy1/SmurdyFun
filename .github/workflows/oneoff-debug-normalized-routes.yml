name: Debug normalized quiz routes

on:
  push:
    branches: [feat/normalized-quiz-routes]

permissions:
  contents: read

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalized-quiz-routes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact complete-workflow recipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          specs = [
              ('.github/workflows/oneoff-complete-routes.yml', 'Apply validated migration recipe'),
              ('.github/workflows/oneoff-complete-routes.yml', 'Finish test migration')
          ]
          for number, (filename, name) in enumerate(specs, 1):
              source = Path(filename).read_text().splitlines()
              start = next(i for i, line in enumerate(source) if f'- name: {name}' in line)
              run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
              body = []
              for line in source[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/complete-step-{number}.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/complete-step-1.sh
          bash /tmp/complete-step-2.sh
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate
        env:
          SITEMAP_LASTMOD: 2026-09-14
        run: npm run pages:generate
      - name: Diagnose validation
        shell: bash
        run: |
          set +e
          {
            echo '=== TESTS ==='
            npm test
            echo "TEST_STATUS=$?"
            echo '=== VERSION ==='
            grep -n 'APP_VERSION' src/js/app_core.js
            echo '=== ROOT DIRECTORY CARDS ==='
            grep -n 'directory-card-title' quizzes/index.html | head -20
            echo '=== MAP CLICK DIRECTORY ==='
            grep -n 'directory-card-title' quizzes/maps/click/index.html | head -20
            echo '=== CAPITALS DIRECTORY ==='
            grep -n 'directory-card' quizzes/capitals/index.html | head -30
            echo '=== FLAGS DIRECTORY ==='
            grep -n 'directory-card' quizzes/flags/index.html | head -30
            echo '=== SITEMAP CANONICAL ==='
            grep -n 'quizzes/maps/click/countries/world/' sitemap.txt | head
            echo '=== SITEMAP LEGACY ==='
            grep -n 'quizzes/click-country/world/' sitemap.txt | head
            echo '=== DIFF CHECK ==='
            git diff --check
            echo "DIFF_STATUS=$?"
          } 2>&1 | tee validation-output.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-route-validation-output
          path: validation-output.txt
