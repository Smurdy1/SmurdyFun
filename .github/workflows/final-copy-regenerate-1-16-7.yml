name: Final copy regenerate 1.16.7
on:
  push:
    branches: [polish/1.16.7-finalize-copy]
concurrency:
  group: final-copy-regenerate-1-16-7
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/1.16.7-finalize-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Regenerate public quiz pages
        run: npm run pages:generate
      - name: Preserve hidden lore pages
        run: |
          for d in 1313 4824 8 archive bouvet fields jailtime overlap turnover tps; do
            git checkout origin/main -- "$d"
          done
      - name: Validate source files
        run: |
          node --check tools/landing_personality.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
          node --check src/js/app_core.js
          node -e "JSON.parse(require('fs').readFileSync('src/data/quiz_page_descriptions.json','utf8'))"
          grep -Fq 'const APP_VERSION = "1.16.7";' src/js/app_core.js
          ! grep -Eiq '\banchor(s|ed|ing)?\b' src/data/quiz_page_descriptions.json tools/landing_personality.js
          ! grep -Fq 'reference pointss' tools/landing_personality.js
      - name: Run tests
        run: npm test
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit generated pages
        run: |
          rm -f .github/workflows/final-copy-regenerate-1-16-7.yml
          rm -f package-lock.json
          git add -A
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git commit -m "Regenerate pages after final copy polish"
          git push origin HEAD:polish/1.16.7-finalize-copy
