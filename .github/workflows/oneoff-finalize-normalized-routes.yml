name: Finalize normalized quiz routes

on:
  push:
    branches: [feat/normalized-quiz-routes]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalized-quiz-routes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply prepared migration and refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/oneoff-finish-normalized-routes.yml').read_text().splitlines()
          names = [
              'Reuse the prepared source migration',
              'Finalize normalized directories and runtime routes',
              'Migrate public-route test expectations'
          ]
          for number, name in enumerate(names, 1):
              start = next(i for i, line in enumerate(source) if f'- name: {name}' in line)
              run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
              body = []
              for line in source[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/refine-{number}.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/refine-1.sh
          bash /tmp/refine-2.sh
          bash /tmp/refine-3.sh

      - name: Fix final canonical-route edge cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Avoid an escaping-sensitive regex in the recursive landing-page test.
          p = Path('tests/landing_breadcrumbs.test.js')
          text = p.read_text()
          text = re.sub(
              r'\s*const relative = path\.relative\(quizzesRoot, filename\).*?;\n',
              '            const relative = path.relative(quizzesRoot, filename).split(path.sep).join("/");\n',
              text,
              count=1
          )
          p.write_text(text)

          # The route migration has its own cache key, but the quiz runner still uses the memory-fix key.
          p = Path('tests/runtime_memory.test.js')
          text = p.read_text()
          text = text.replace('quiz_runner\\.js\\?v=20260914-routes-1', 'quiz_runner\\.js\\?v=20260910-memory-1')
          p.write_text(text)

          # Canonical leaf routes are four segments deep, so social metadata reads quiz identity from the page.
          p = Path('tools/apply_sharing.js')
          text = p.read_text()
          old = '''function quizRoute(relativePath, html) {\n    if (!/data-smurdy-quiz-page/i.test(html)) return null;\n    const slashPath = relativePath.replace(/\\\\/g, "/");\n    const match = slashPath.match(/^quizzes\\/([^/]+)\\/([^/]+)\\/index\\.html$/i);\n    if (!match) return null;\n    return { quizId: match[1], groupId: match[2] };\n}'''
          new = '''function quizRoute(relativePath, html) {\n    if (!/data-smurdy-quiz-page/i.test(html)) return null;\n    const body = html.match(/<body\\b[^>]*data-smurdy-quiz-page[^>]*>/i)?.[0] || "";\n    const quizId = extractAttribute(body, /<body\\b[^>]*>/i, "data-quiz-id");\n    const groupId = extractAttribute(body, /<body\\b[^>]*>/i, "data-quiz-group");\n    if (quizId && groupId) return { quizId, groupId };\n    const slashPath = relativePath.replace(/\\\\/g, "/");\n    const match = slashPath.match(/^quizzes\\/([^/]+)\\/([^/]+)\\/index\\.html$/i);\n    return match ? { quizId: match[1], groupId: match[2] } : null;\n}'''
          if old not in text:
              raise SystemExit('quizRoute block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate canonical pages and directories
        env:
          SITEMAP_LASTMOD: 2026-09-14
        run: npm run pages:generate

      - name: Validate
        run: |
          node --check src/js/quiz_routes.js
          node --check tools/normalize_quiz_routes.js
          node --check tools/apply_sharing.js
          node --check src/js/quiz_completion.js
          node --check src/js/quiz_suggestions.js
          node --check src/js/quiz_launch_intent.js
          npm test
          test -f quizzes/maps/click/countries/world/index.html
          test -f quizzes/maps/click/subdivisions/us_states/index.html
          test -f quizzes/capitals/type/countries/world/index.html
          test -f quizzes/capitals/type/subdivisions/us_states/index.html
          test -f quizzes/flags/type/countries/world/index.html
          test -f quizzes/flags/type/subdivisions/us_states/index.html
          grep -q 'const APP_VERSION = "1.15.0"' src/js/app_core.js
          grep -q 'directory-card-title">Maps' quizzes/index.html
          grep -q 'directory-card-title">Capitals' quizzes/index.html
          grep -q 'directory-card-title">Flags' quizzes/index.html
          grep -q 'directory-card-title">Countries' quizzes/maps/click/index.html
          grep -q 'directory-card-title">Subdivisions' quizzes/maps/click/index.html
          grep -q 'directory-card-disabled' quizzes/capitals/index.html
          grep -q 'directory-card-disabled' quizzes/flags/index.html
          grep -q 'https://smurdy.fun/quizzes/maps/click/countries/world/' sitemap.txt
          ! grep -q 'https://smurdy.fun/quizzes/click-country/world/' sitemap.txt
          git diff --check

      - name: Commit completed migration
        run: |
          rm -f test-output.txt
          rm -f .github/workflows/oneoff-normalized-quiz-routes.yml
          rm -f .github/workflows/oneoff-finish-normalized-routes.yml
          rm -f .github/workflows/oneoff-finalize-normalized-routes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "1.15.0: Normalize quiz routes and directories"
          git push origin HEAD:feat/normalized-quiz-routes
