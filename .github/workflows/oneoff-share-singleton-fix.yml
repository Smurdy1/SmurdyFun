name: Fix duplicate share trigger
on:
  push:
    branches: [fix/weak-spots-share-duplicate]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weak-spots-share-duplicate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/tmp_share_singleton_fix.js
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: SITEMAP_LASTMOD=2026-09-11 npm run pages:generate
      - run: node --check src/js/share.js
      - run: node --check tools/apply_sharing.js
      - run: npm test
      - run: git diff --check
      - run: |
          rm tools/tmp_share_singleton_fix.js
          rm .github/workflows/oneoff-share-singleton-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent duplicate Share controls on dynamic quizzes"
          git push origin HEAD:fix/weak-spots-share-duplicate
