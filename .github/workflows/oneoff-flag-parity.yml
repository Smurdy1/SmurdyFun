name: One-off flag parity foundations

on:
  push:
    branches:
      - codex/flag-parity-foundations

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flag-parity-foundations
          fetch-depth: 0

      - name: Apply parity architecture changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern!r}')
              write(path, updated)

          launch_intent = r'''(function initQuizLaunchIntent(root, factory) {
              "use strict";
              const api = factory(root);
              if (typeof module === "object" && module.exports) module.exports = api;
              if (root) root.SmurdyQuizLaunchIntent = api;
          })(typeof window !== "undefined" ? window : null, function createQuizLaunchIntentApi(root) {
              "use strict";

              const STORAGE_KEY = "smurdy-quiz-launch-v1";
              const MAX_AGE_MS = 5 * 60 * 1000;

              function normalizeId(value) {
                  const normalized = String(value || "").trim().toLowerCase();
                  return /^[a-z0-9_-]+$/.test(normalized) ? normalized : "";
              }

              function parseQuizPath(pathname) {
                  const match = String(pathname || "").match(/^\/quizzes\/([^/]+)\/([^/]+)\/?$/);
                  if (!match) return null;
                  try {
                      const quizId = normalizeId(decodeURIComponent(match[1]));
                      const groupId = normalizeId(decodeURIComponent(match[2]));
                      return quizId && groupId ? { quizId, groupId } : null;
                  } catch (_) {
                      return null;
                  }
              }

              function createClient({ storage = null, now = () => Date.now(), pathname = () => "" } = {}) {
                  function getStorage() {
                      try {
                          return typeof storage === "function" ? storage() : storage;
                      } catch (_) {
                          return null;
                      }
                  }

                  function clear() {
                      try { getStorage()?.removeItem(STORAGE_KEY); } catch (_) {}
                  }

                  function readIntent() {
                      try {
                          const value = getStorage()?.getItem(STORAGE_KEY);
                          if (!value) return null;
                          const parsed = JSON.parse(value);
                          const quizId = normalizeId(parsed?.quizId);
                          const groupId = normalizeId(parsed?.groupId);
                          const createdAt = Number(parsed?.createdAt || 0);
                          if (!quizId || !groupId || !createdAt || now() - createdAt > MAX_AGE_MS) {
                              clear();
                              return null;
                          }
                          return {
                              version: 1,
                              quizId,
                              groupId,
                              reason: String(parsed?.reason || "direct"),
                              createdAt
                          };
                      } catch (_) {
                          clear();
                          return null;
                      }
                  }

                  function storeIntent(quizId, groupId, reason = "direct") {
                      const cleanQuizId = normalizeId(quizId);
                      const cleanGroupId = normalizeId(groupId);
                      const target = getStorage();
                      if (!cleanQuizId || !cleanGroupId || !target) return false;
                      try {
                          target.setItem(STORAGE_KEY, JSON.stringify({
                              version: 1,
                              quizId: cleanQuizId,
                              groupId: cleanGroupId,
                              reason: String(reason || "direct"),
                              createdAt: now()
                          }));
                          return true;
                      } catch (_) {
                          return false;
                      }
                  }

                  function peekFor(quizId, groupId) {
                      const intent = readIntent();
                      if (!intent) return null;
                      return intent.quizId === normalizeId(quizId) && intent.groupId === normalizeId(groupId)
                          ? { ...intent }
                          : null;
                  }

                  function consumeFor(quizId, groupId) {
                      const intent = peekFor(quizId, groupId);
                      if (!intent) return null;
                      clear();
                      return intent;
                  }

                  function currentRoute() {
                      return parseQuizPath(typeof pathname === "function" ? pathname() : pathname);
                  }

                  function peekCurrent() {
                      const route = currentRoute();
                      return route ? peekFor(route.quizId, route.groupId) : null;
                  }

                  function consumeCurrent() {
                      const route = currentRoute();
                      return route ? consumeFor(route.quizId, route.groupId) : null;
                  }

                  return Object.freeze({
                      store: storeIntent,
                      clear,
                      peekFor,
                      consumeFor,
                      peekCurrent,
                      consumeCurrent
                  });
              }

              const client = createClient({
                  storage: () => root?.sessionStorage || null,
                  pathname: () => root?.location?.pathname || ""
              });

              return Object.freeze({
                  STORAGE_KEY,
                  MAX_AGE_MS,
                  parseQuizPath,
                  createClient,
                  store: client.store,
                  clear: client.clear,
                  peekFor: client.peekFor,
                  consumeFor: client.consumeFor,
                  peekCurrent: client.peekCurrent,
                  consumeCurrent: client.consumeCurrent
              });
          });
          '''
          write('src/js/quiz_launch_intent.js', launch_intent)

          flag_catalog = r'''(function initFlagCatalog(root, factory) {
              "use strict";
              const api = factory();
              if (typeof module === "object" && module.exports) module.exports = api;
              if (root) root.SmurdyFlagCatalog = api;
          })(typeof self !== "undefined" ? self : globalThis, function createFlagCatalogApi() {
              "use strict";

              function humanize(value) {
                  return String(value || "")
                      .replace(/[_-]+/g, " ")
                      .replace(/\s+/g, " ")
                      .trim()
                      .replace(/\b\w/g, character => character.toUpperCase());
              }

              function membersForGroup(group) {
                  if (Array.isArray(group?.members)) return group.members.slice();
                  if (Array.isArray(group?.countries)) return group.countries.slice();
                  return [];
              }

              function memberCountForGroup(group) {
                  const declared = Number(group?.memberCount || 0);
                  if (Number.isFinite(declared) && declared > 0) return declared;
                  return membersForGroup(group).length;
              }

              function defaultNotable(group) {
                  if (Array.isArray(group?.notable) && group.notable.length) {
                      return group.notable.slice(0, 5);
                  }
                  return membersForGroup(group).slice(0, 5);
              }

              function derivedCountryGroup(groupId, mapGroup, override = {}) {
                  const label = override.label || mapGroup?.label || humanize(groupId);
                  const memberCount = memberCountForGroup(mapGroup);
                  const base = {
                      label,
                      shortLabel: label,
                      family: "countries",
                      allowedTypes: ["type"],
                      unitName: "country",
                      memberCount,
                      sourceKind: "country",
                      description: `Identify ${memberCount} flags from Smurdy's ${label} country set.`,
                      lead: `Type the country represented by each flag in the ${label} set.`,
                      overview: `This flag set uses the same ${label} country group as Smurdy's map quizzes, keeping flag and map practice aligned.`,
                      challenge: "Neighboring countries and recurring flag patterns can look similar, so small symbols, stripe order, and proportions matter.",
                      studyTip: `Learn the ${label} set in smaller clusters, then mix the full group once the designs feel familiar.`,
                      notable: defaultNotable(mapGroup)
                  };

                  const merged = { ...base, ...override };
                  merged.label = override.label || label;
                  merged.shortLabel = override.shortLabel || merged.label;
                  merged.family = "countries";
                  merged.allowedTypes = ["type"];
                  merged.memberCount = memberCount;
                  merged.sourceKind = "country";
                  merged.notable = Array.isArray(override.notable)
                      ? override.notable.slice()
                      : defaultNotable(mapGroup);

                  if (groupId === "world") delete merged.sourceGroup;
                  else merged.sourceGroup = groupId;
                  return merged;
              }

              function expandFlagGroups(flagOverrides = {}, countryGroups = {}) {
                  const expanded = {};

                  for (const [groupId, mapGroup] of Object.entries(countryGroups || {})) {
                      if (
                          Array.isArray(mapGroup?.allowedTypes) &&
                          mapGroup.allowedTypes.length &&
                          !mapGroup.allowedTypes.includes("type")
                      ) {
                          continue;
                      }
                      const memberCount = memberCountForGroup(mapGroup);
                      if (!memberCount) continue;
                      expanded[groupId] = derivedCountryGroup(
                          groupId,
                          mapGroup,
                          flagOverrides?.[groupId] || {}
                      );
                  }

                  for (const [groupId, group] of Object.entries(flagOverrides || {})) {
                      if (!expanded[groupId]) expanded[groupId] = { ...group };
                  }

                  return expanded;
              }

              return Object.freeze({
                  humanize,
                  membersForGroup,
                  memberCountForGroup,
                  expandFlagGroups
              });
          });
          '''
          write('src/js/flag_catalog.js', flag_catalog)

          sitemap_tool = r'''const fs = require("node:fs");
          const path = require("node:path");

          function escapeXml(value) {
              return String(value)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;");
          }

          function indexFiles(directory) {
              if (!fs.existsSync(directory)) return [];
              const files = [];
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const fullPath = path.join(directory, entry.name);
                  if (entry.isDirectory()) files.push(...indexFiles(fullPath));
                  else if (entry.isFile() && entry.name === "index.html") files.push(fullPath);
              }
              return files;
          }

          function canonicalFromHtml(html) {
              if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(html)) {
                  return null;
              }
              const match = html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i) ||
                  html.match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["']/i);
              return match ? match[1].trim() : null;
          }

          function rebuildSitemaps({ repoRoot, publicRoot = "https://smurdy.fun", lastmod = null }) {
              const base = String(publicRoot || "https://smurdy.fun").replace(/\/+$/, "");
              const fixed = [
                  `${base}/`,
                  `${base}/quizzes/`,
                  `${base}/about/`,
                  `${base}/contact/`,
                  `${base}/privacy/`
              ];
              const discovered = indexFiles(path.join(repoRoot, "quizzes"))
                  .map(file => canonicalFromHtml(fs.readFileSync(file, "utf8")))
                  .filter(url => url && url.startsWith(`${base}/`));
              const fixedSet = new Set(fixed);
              const urls = [
                  ...fixed,
                  ...Array.from(new Set(discovered))
                      .filter(url => !fixedSet.has(url))
                      .sort((a, b) => a.localeCompare(b))
              ];
              const date = lastmod || process.env.SITEMAP_LASTMOD || new Date().toISOString().slice(0, 10);
              const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.map((url, index) => `  <url>\n    <loc>${escapeXml(url)}</loc>\n    <lastmod>${date}</lastmod>\n    <changefreq>${index < fixed.length ? "weekly" : "monthly"}</changefreq>\n  </url>`).join("\n")}\n</urlset>`;
              fs.writeFileSync(path.join(repoRoot, "sitemap.xml"), xml);
              fs.writeFileSync(path.join(repoRoot, "sitemap.txt"), `${urls.join("\n")}\n`);
              return urls;
          }

          if (require.main === module) {
              rebuildSitemaps({
                  repoRoot: path.resolve(__dirname, ".."),
                  publicRoot: process.env.BASE_URL || "https://smurdy.fun"
              });
          }

          module.exports = { rebuildSitemaps, canonicalFromHtml };
          '''
          write('tools/rebuild_sitemaps.js', sitemap_tool)

          # Make the canonical entity policy feed the flag sync target list.
          replace_once(
              'tools/sync_wikimedia_flags.js',
              'const SOURCES_PATH = path.join(ROOT, "src/data/flag_sources.json");\n',
              'const SOURCES_PATH = path.join(ROOT, "src/data/flag_sources.json");\nconst { ADMIN_OVERRIDES, getCanonicalCountryName } = require("../src/js/quiz_entities.js");\n'
          )
          replace_once(
              'tools/sync_wikimedia_flags.js',
              'function buildTargets(countryFlags, countries, states) {\n  const targets = countryFlags.map((entry) => ({\n',
              '''function explicitQuizEntityTargets(countryFlags, countryFeatures) {
  const existing = new Set(countryFlags.map((entry) => entry.name));
  const targets = [];

  for (const feature of countryFeatures || []) {
    const properties = feature?.properties || {};
    const overrideKey = [
      properties.ADMIN,
      properties.admin,
      properties.GEOUNIT,
      properties.geounit,
    ].find((value) => value && ADMIN_OVERRIDES[String(value).trim()]);
    if (!overrideKey) continue;

    const name = getCanonicalCountryName(feature);
    if (!name || existing.has(name)) continue;
    const code = String(properties.ISO_A2 || properties.iso_a2 || "").toLowerCase();
    const qid = properties.WIKIDATAID || properties.wikidataid || null;
    if (!code || code === "-99") {
      throw new Error(`${name} has no usable ISO_A2 code for its flag filename`);
    }
    targets.push({ kind: "country", name, code, qid, filename: `${code}.svg` });
    existing.add(name);
  }

  return targets;
}

function buildTargets(countryFlags, countries, states) {
  const targets = countryFlags.map((entry) => ({
'''
          )
          replace_once(
              'tools/sync_wikimedia_flags.js',
              '    filename: countryDestination(entry),\n  }));\n\n  for (const feature of states.features) {\n',
              '    filename: countryDestination(entry),\n  }));\n\n  targets.push(...explicitQuizEntityTargets(countryFlags, countries.features));\n\n  for (const feature of states.features) {\n'
          )
          replace_once(
              'tools/sync_wikimedia_flags.js',
              '  buildTargets,\n  countryDestination,\n',
              '  buildTargets,\n  explicitQuizEntityTargets,\n  countryDestination,\n'
          )

          # Seed Palestine in the current source manifest. ps.svg already exists in assets/flags.
          sources_path = ROOT / 'src/data/flag_sources.json'
          sources = json.loads(sources_path.read_text())
          if not any(flag.get('name') == 'Palestine' and flag.get('kind') == 'country' for flag in sources.get('flags', [])):
              sources['flags'].append({
                  'code': 'ps',
                  'name': 'Palestine',
                  'kind': 'country',
                  'filename': 'ps.svg',
                  'wikidataId': 'Q219060',
                  'commonsFile': 'Flag of Palestine.svg',
                  'commonsPage': 'https://commons.wikimedia.org/wiki/File:Flag_of_Palestine.svg',
                  'license': 'Public domain',
                  'attributionRequired': False
              })
          sources['flags'].sort(key=lambda flag: (str(flag.get('code', '')), str(flag.get('name', ''))))
          sources_path.write_text(json.dumps(sources, indent=2, ensure_ascii=False) + '\n')

          groups_path = ROOT / 'src/data/flag_groups.json'
          raw_groups = json.loads(groups_path.read_text())
          raw_groups['world']['memberCount'] = 201
          raw_groups['world']['description'] = 'Identify all 201 country and territory flags by name.'
          raw_groups['world']['lead'] = 'Identify every country and territory flag by typing the place it represents.'
          raw_groups['asia']['memberCount'] = 51
          raw_groups['asia']['description'] = "Practice all 51 flags in Smurdy's Asia set."
          raw_groups['asia']['lead'] = 'Type the place represented by each of the 51 Asian flags.'
          groups_path.write_text(json.dumps(raw_groups, indent=2, ensure_ascii=False) + '\n')

          # Homepage loads the shared launch and flag catalog layers before consumers.
          replace_once(
              'index.html',
              '     <script src="/src/js/analytics.js?v=20260823-quiz-analytics-1" defer></script>\n     <script src="/src/js/weak_spots.js?v=20260826-ui-polish-1" defer></script>\n     <script src="/src/js/quiz_library.js?v=20260828-quiz-library-1" defer></script>\n  <script src="/src/js/app.js?v=20260828-quiz-library-1" defer></script>\n     <script src="/src/js/manifest.js?v=20260722-independent-menu-control-1" defer></script>\n     <script src="/src/js/browse.js?v=20260902-quiz-browser-1" defer></script>',
              '     <script src="/src/js/analytics.js?v=20260823-quiz-analytics-1" defer></script>\n     <script src="/src/js/quiz_launch_intent.js?v=20260903-flag-parity-1" defer></script>\n     <script src="/src/js/flag_catalog.js?v=20260903-flag-parity-1" defer></script>\n     <script src="/src/js/weak_spots.js?v=20260903-flag-parity-1" defer></script>\n     <script src="/src/js/quiz_library.js?v=20260828-quiz-library-1" defer></script>\n  <script src="/src/js/app.js?v=20260828-quiz-library-1" defer></script>\n     <script src="/src/js/manifest.js?v=20260722-independent-menu-control-1" defer></script>\n     <script src="/src/js/browse.js?v=20260903-flag-parity-1" defer></script>'
          )

          # Browser group discovery expands flag groups from the map group catalog.
          replace_once(
              'src/js/browse.js',
              '        groupSets[safeId] = data;\n        return data;\n',
              '''        let resolvedData = data;
        if (
            safeId === "flag_groups" &&
            window.SmurdyFlagCatalog?.expandFlagGroups
        ) {
            const countryGroups = groupSets.country_groups ||
                await loadGroupSet("country_groups");
            resolvedData = window.SmurdyFlagCatalog.expandFlagGroups(
                data,
                countryGroups
            );
        }

        groupSets[safeId] = resolvedData;
        return resolvedData;
'''
          )
          replace_once(
              'src/js/browse.js',
              '''                    if (categoryKeyForManifest(manifestItem) === "flags") {
                        window.location.assign(link.href);
                        return;
                    }
''',
              '''                    if (categoryKeyForManifest(manifestItem) === "flags") {
                        window.SmurdyQuizLaunchIntent?.store?.(
                            manifestItem.id,
                            link.dataset.group || "world",
                            "browser"
                        );
                        window.location.assign(link.href);
                        return;
                    }
'''
          )

          # Weak Spots now navigate with a clean canonical URL and session launch intent.
          replace_once(
              'src/js/weak_spots.js',
              '''    function practiceUrl(stage) {
        return "/quizzes/" + stage.quizId + "/" + encodeURIComponent(stage.group) + "/?weakSpotsPractice=1";
    }

    function openPracticeStage(stage) {
        if (!stage || !root?.location) return;
        root.location.assign(practiceUrl(stage));
    }
''',
              '''    function practiceUrl(stage) {
        return "/quizzes/" + stage.quizId + "/" + encodeURIComponent(stage.group) + "/";
    }

    function openPracticeStage(stage) {
        if (!stage || !root?.location) return;
        let stored = false;
        try {
            stored = Boolean(root.SmurdyQuizLaunchIntent?.store?.(
                stage.quizId,
                stage.group,
                "weak_spots"
            ));
        } catch (_) {}

        // Backward-compatible fallback if the shared helper failed to load.
        if (!stored) {
            try {
                session()?.setItem("smurdy-quiz-launch-v1", JSON.stringify({
                    version: 1,
                    quizId: stage.quizId,
                    groupId: stage.group,
                    reason: "weak_spots",
                    createdAt: Date.now()
                }));
            } catch (_) {}
        }
        root.location.assign(practiceUrl(stage));
    }
'''
          )

          # Map runner consumes the launch intent after the landing page rebuilds the app shell.
          replace_once(
              'src/js/quiz_runner.js',
              '''    const weakSpotsPracticeStage = (() => {
        try {
            const requested = new URLSearchParams(window.location.search)
                .get("weakSpotsPractice") === "1";
            if (!requested) return null;
            return window.SmurdyWeakSpots?.getActivePracticeStage?.() || null;
        } catch (_) {
            return null;
        }
    })();
''',
              '''    const quizLaunchIntent = (() => {
        try {
            return window.SmurdyQuizLaunchIntent?.consumeCurrent?.() || null;
        } catch (_) {
            return null;
        }
    })();

    const legacyWeakSpotsRequested = (() => {
        try {
            const params = new URLSearchParams(window.location.search);
            const requested = params.get("weakSpotsPractice") === "1";
            if (requested) {
                params.delete("weakSpotsPractice");
                const query = params.toString();
                history.replaceState(
                    {},
                    "",
                    window.location.pathname + (query ? "?" + query : "") + window.location.hash
                );
            }
            return requested;
        } catch (_) {
            return false;
        }
    })();

    const weakSpotsPracticeStage = (() => {
        try {
            const requested = quizLaunchIntent?.reason === "weak_spots" || legacyWeakSpotsRequested;
            if (!requested) return null;
            const stage = window.SmurdyWeakSpots?.getActivePracticeStage?.() || null;
            if (!stage) return null;
            const route = String(window.location.pathname || "")
                .match(/^\/quizzes\/([^/]+)\/([^/]+)\/?$/);
            if (route) {
                if (stage.quizId && decodeURIComponent(route[1]) !== String(stage.quizId)) return null;
                if (stage.group && decodeURIComponent(route[2]) !== String(stage.group)) return null;
            }
            return stage;
        } catch (_) {
            return null;
        }
    })();
'''
          )
          replace_once(
              'src/js/quiz_runner.js',
              '    beginAnalyticsRun("initial");\n',
              '    beginAnalyticsRun(weakSpotsPracticeStage ? "weak_spots" : "initial");\n'
          )

          # Replace the map landing controller with intent-aware clean launching.
          quiz_landing = r'''(() => {
              "use strict";

              document.body.classList.add("smurdy-quiz-landing");

              if (!document.querySelector("link[data-smurdy-landing-polish]")) {
                  const stylesheet = document.createElement("link");
                  stylesheet.rel = "stylesheet";
                  stylesheet.href = "/styles/quiz_landing.css?v=20260827-landing-width-1";
                  stylesheet.setAttribute("data-smurdy-landing-polish", "true");
                  document.head.appendChild(stylesheet);
              }

              const launchButton = document.querySelector("[data-smurdy-quiz-launch]");
              if (!launchButton) return;

              function ensureAnalytics() {
                  if (window.SmurdyAnalytics) return Promise.resolve(window.SmurdyAnalytics);
                  return new Promise(resolve => {
                      let script = document.querySelector("script[data-smurdy-analytics]");
                      if (!script) {
                          script = document.createElement("script");
                          script.src = "/src/js/analytics.js?v=20260823-quiz-analytics-1";
                          script.defer = true;
                          script.setAttribute("data-smurdy-analytics", "true");
                          document.head.appendChild(script);
                      }
                      const finish = () => resolve(window.SmurdyAnalytics || null);
                      script.addEventListener("load", finish, { once: true });
                      script.addEventListener("error", finish, { once: true });
                      if (window.SmurdyAnalytics) finish();
                  });
              }

              function prepareInitialLaunchIntent() {
                  let intent = null;
                  try {
                      const params = new URLSearchParams(window.location.search);
                      const legacyWeakSpots =
                          params.get("weakSpotsPractice") === "1" &&
                          Boolean(sessionStorage.getItem("smurdy-weak-spots-practice-v1"));
                      if (legacyWeakSpots) {
                          const route = window.SmurdyQuizLaunchIntent?.parseQuizPath?.(window.location.pathname);
                          if (route) {
                              window.SmurdyQuizLaunchIntent?.store?.(
                                  route.quizId,
                                  route.groupId,
                                  "weak_spots"
                              );
                          }
                          params.delete("weakSpotsPractice");
                          const query = params.toString();
                          history.replaceState(
                              {},
                              "",
                              window.location.pathname + (query ? "?" + query : "") + window.location.hash
                          );
                      }
                      intent = window.SmurdyQuizLaunchIntent?.peekCurrent?.() || null;
                  } catch (_) {}
                  return intent;
              }

              const initialLaunchIntent = prepareInitialLaunchIntent();

              if (!initialLaunchIntent) {
                  void ensureAnalytics().then(analytics => {
                      analytics?.trackLandingPageView?.({ page_type: "quiz_landing" });
                  });
              }

              async function launchQuiz() {
                  if (launchButton.disabled) return;
                  const originalText = launchButton.textContent;
                  launchButton.disabled = true;
                  launchButton.textContent = "Loading quiz...";
                  document.documentElement.setAttribute("aria-busy", "true");

                  try {
                      const response = await fetch("/", {
                          credentials: "same-origin",
                          headers: { "X-Smurdy-Quiz-Launch": "in-place" }
                      });
                      if (!response.ok) {
                          throw new Error(`Could not load the quiz app (HTTP ${response.status}).`);
                      }
                      const appHtml = await response.text();
