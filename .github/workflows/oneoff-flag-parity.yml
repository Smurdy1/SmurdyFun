                  const link = document.createElement("a");
                  link.href = "/privacy/";
                  link.textContent = "Privacy";
                  footer.append(separator, link);
              }
              if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", addPrivacyLink, { once: true });
              } else {
                  addPrivacyLink();
              }
          })();
