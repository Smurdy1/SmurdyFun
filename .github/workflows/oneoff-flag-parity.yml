name: One-off flag parity foundations

on:
  push:
    branches:
      - codex/flag-parity-foundations

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flag-parity-foundations
          fetch-depth: 0

      - name: Apply parity source migration
        run: python tools/oneoff_flag_parity.py

      - name: Install dependencies
        run: npm ci

      - name: Run source tests
        run: npm test

      - name: Regenerate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-03'
        run: npm run pages:generate

      - name: Run generated-page tests
        run: npm test

      - name: Commit parity update
        run: |
          rm -f .github/workflows/oneoff-flag-parity.yml tools/oneoff_flag_parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify flag quiz parity foundations"
          git push origin HEAD:codex/flag-parity-foundations
