name: One-off 1.14.2 site polish validation

on:
  push:
    branches:
      - polish/site-ui-editorial-pass

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/site-ui-editorial-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-09'
        run: npm run pages:generate

      - name: Check JavaScript syntax
        run: |
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
          node --check tools/quiz_page_shell.js
          node --check src/js/browse.js
          node --check src/js/quiz_completion.js
          node --check src/js/weak_spots.js
          node --check src/js/manifest.js
          node --check src/js/quiz_landing.js
          node --check src/js/app_core.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated pages
        run: |
          rm -f .github/workflows/oneoff-site-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.14.2: Regenerate polished site pages"
          git push origin HEAD:polish/site-ui-editorial-pass
