name: One-off share panel placement validation

on:
  push:
    branches:
      - fix/share-panel-placement

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout share placement branch
        uses: actions/checkout@v4
        with:
          ref: fix/share-panel-placement
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate sharing assets and page metadata
        env:
          SITEMAP_LASTMOD: 2026-09-10
        run: npm run pages:generate

      - name: JavaScript syntax checks
        run: |
          node --check src/js/share.js
          node --check tools/apply_sharing.js

      - name: Run tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit regenerated output
        run: |
          rm .github/workflows/oneoff-share-panel-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "1.14.8: Place sharing inside panels"
            git push origin HEAD:fix/share-panel-placement
          fi
