name: Finalize lore media once

on:
  push:
    branches:
      - remove-redrawn-lore-svgs-cleanup
    paths:
      - .github/workflows/finalize-lore-media-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-redrawn-lore-svgs-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lore cleanup
        run: |
          sed -i 's/, share_fn, s, flags=re.S)/, lambda _: share_fn, s, flags=re.S)/' tools/finalize_lore_once.py
          sed -i 's/, archive_fn, s, flags=re.S)/, lambda _: archive_fn, s, flags=re.S)/' tools/finalize_lore_once.py
          python tools/finalize_lore_once.py
      - name: Generate Smurdy Encryption artifact
        run: |
          python -m pip install pillow
          python tools/smurdencryption_generator_once.py 'OCVLVS SMVRDII OMNIA VIDET' assets/lore/smurdencryption.png
      - name: Run lore regression tests
        run: node --test tests/lore_system.test.js
      - name: Commit result
        run: |
          git rm .github/workflows/finalize-lore-media-once.yml tools/finalize_lore_once.py tools/smurdencryption_generator_once.py
          git config user.name 'Smurdy'
          git config user.email '110361649+Smurdy1@users.noreply.github.com'
          git add -A
          git commit -m '1.16.1 Use original lore artifacts throughout'
          git push origin HEAD:remove-redrawn-lore-svgs-cleanup
