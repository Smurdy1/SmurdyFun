name: Apply Weak Spots visual hierarchy polish

on:
  push:
    branches:
      - polish/weak-spots-visual-hierarchy

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[weak-spots-visual]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/weak-spots-visual-hierarchy
          fetch-depth: 0

      - name: Apply edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          weak = Path('src/js/weak_spots.js')
          text = weak.read_text()

          text = text.replace(
              '''                '<li class="weak-spot-item">' +\n                    '<div class="weak-spot-name">' +\n                        escapeHtml(entry.name) + " · " + escapeHtml(modeLabel(entry.mode)) +\n                    "</div>" +\n                    '<div class="weak-spot-meta">' +\n                        Number(entry.misses || 0) + " " +\n                        (Number(entry.misses) === 1 ? "miss" : "misses") +\n                    "</div>" +\n                "</li>"''',
              '''                '<li class="weak-spot-item">' +\n                    '<div class="weak-spot-main">' +\n                        '<span class="weak-spot-name">' + escapeHtml(entry.name) + "</span>" +\n                        '<span class="weak-spot-group">' + escapeHtml(humanizeGroup(entry.group)) + "</span>" +\n                        '<span class="weak-spot-mode">' + escapeHtml(modeLabel(entry.mode)) + "</span>" +\n                    "</div>" +\n                    '<div class="weak-spot-meta">' +\n                        Number(entry.misses || 0) + " " +\n                        (Number(entry.misses) === 1 ? "miss" : "misses") +\n                    "</div>" +\n                "</li>"''',
              1
          )

          old_header = '''                    '<div><h2 id="weak-spots-title">Weak Spots</h2>' +\n                    "<p>Each quiz type is tracked separately. Retry Missed uses the same kind of question, and one clean answer clears that weak spot.</p></div>" +'''
          new_header = '''                    '<div><h2 id="weak-spots-title">Weak Spots</h2></div>' +'''
          if old_header not in text:
              raise SystemExit('Weak Spots explanatory paragraph not found')
          text = text.replace(old_header, new_header, 1)
          weak.write_text(text)

          css = Path('styles/style.css')
          css_text = css.read_text()
          anchor = '.weak-spot-name{font-weight:750;line-height:1.3}\n.weak-spot-meta{margin-top:3px;color:var(--smurdy-muted);font-size:13px;line-height:1.4}'
          replacement = '''.weak-spot-main{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}\n.weak-spot-name{font-weight:750;line-height:1.3}\n.weak-spot-group,.weak-spot-mode{display:inline-flex;min-height:24px;padding:3px 8px;align-items:center;border-radius:6px;font-size:12px;font-weight:650;line-height:1.2}\n.weak-spot-group{background:#f1f3f5;color:#4c5157}\n.weak-spot-mode{border:1px solid rgba(0,119,204,.22);background:rgba(0,119,204,.07);color:#075f9e}\n.weak-spot-meta{margin-top:4px;color:var(--smurdy-muted);font-size:13px;line-height:1.4}'''
          if anchor not in css_text:
              raise SystemExit('Base Weak Spots CSS anchor not found')
          css_text = css_text.replace(anchor, replacement, 1)

          # Existing later polish rules may override these selectors. Append a final scoped block
          # so the intended hierarchy wins without disturbing unrelated styles.
          css_text += '''\n\n/* Weak Spots visual hierarchy */\n#weak-spots-dialog .weak-spot-item{display:block}\n#weak-spots-dialog .weak-spot-main{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}\n#weak-spots-dialog .weak-spot-name{min-width:0;font-weight:750;line-height:1.3}\n#weak-spots-dialog .weak-spot-group,#weak-spots-dialog .weak-spot-mode{display:inline-flex;min-height:24px;padding:3px 8px;align-items:center;border-radius:6px;font-size:12px;font-weight:650;line-height:1.2;white-space:nowrap}\n#weak-spots-dialog .weak-spot-group{background:#f1f3f5;color:#4c5157}\n#weak-spots-dialog .weak-spot-mode{border:1px solid rgba(0,119,204,.22);background:rgba(0,119,204,.07);color:#075f9e}\n#weak-spots-dialog .weak-spot-meta{min-width:0;margin-top:4px;padding:0;background:transparent;color:var(--smurdy-muted);font-size:13px;font-weight:400;line-height:1.4;text-align:left}\n#weak-spots-dialog .weak-spots-dialog-header h2{margin-bottom:0}\n'''
          css.write_text(css_text)

          workflow = Path('.github/workflows/oneoff-weak-spots-visual-hierarchy.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Weak Spots visual hierarchy [weak-spots-visual]"
          git push origin HEAD:polish/weak-spots-visual-hierarchy
