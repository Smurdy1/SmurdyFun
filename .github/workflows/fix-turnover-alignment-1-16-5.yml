name: Fix Turnover alignment 1.16.5
on:
  push:
    branches: [fix/1.16.5-turnover-alignment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.16.5-turnover-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply alignment fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "styles/lore.css",
              '''    text-align: center;\n    user-select: text;\n}''',
              '''    text-align: left;\n    user-select: text;\n}'''
          )
          replace_once(
              "turnover/index.html",
              '/styles/lore.css?v=20260916-lore-2',
              '/styles/lore.css?v=20260916-lore-5'
          )
          replace_once(
              "src/js/app_core.js",
              'const APP_VERSION = "1.16.4";',
              'const APP_VERSION = "1.16.5";'
          )
          replace_once(
              "tests/runtime_memory.test.js",
              'const APP_VERSION = "1\\.16\\.4";',
              'const APP_VERSION = "1\\.16\\.5";'
          )
          replace_once(
              "tests/editorial_identity.test.js",
              'const APP_VERSION = "1\\.16\\.4"',
              'const APP_VERSION = "1\\.16\\.5"'
          )

          p = Path("tests/lore_system.test.js")
          s = p.read_text()
          marker = '''    assert.match(css, /\\.lore-turnover\\s*\\{[\\s\\S]*background:\\s*#0077cc/);\n'''
          addition = marker + '''    assert.match(css, /\\.lore-turnover\\s*\\{[\\s\\S]*place-items:\\s*center/);\n    assert.match(css, /\\.lore-turnover-text\\s*\\{[\\s\\S]*text-align:\\s*left/);\n'''
          if marker not in s:
              raise SystemExit("Turnover lore regression marker missing")
          p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate
        run: |
          node --check src/js/app_core.js
          npm test
          git diff --check
      - name: Commit release
        run: |
          rm .github/workflows/fix-turnover-alignment-1-16-5.yml
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git add -A
          git commit -m "Fix Turnover poem alignment"
          git push origin HEAD:fix/1.16.5-turnover-alignment
