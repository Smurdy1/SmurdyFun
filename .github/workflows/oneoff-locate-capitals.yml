name: One-off locate capitals validation

on:
  push:
    branches:
      - feature/locate-capitals-coming-soon

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/locate-capitals-coming-soon
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/js/manifest.js
          node --check tools/generate_quiz_pages.js
      - name: Focused tests
        run: node --test tests/quiz_definitions.test.js tests/quiz_library.test.js
      - name: Full tests
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove one-off workflow
        run: |
          rm .github/workflows/oneoff-locate-capitals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove locate capitals validation workflow"
          git push origin HEAD:feature/locate-capitals-coming-soon
