name: One-off completion suggestion implementation

on:
  push:
    branches: [feature/post-completion-suggestions]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-completion-suggestions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire suggestions into runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/js/app.js",
              'const ASSET_VERSION = "20260910-memory-1";',
              'const ASSET_VERSION = "20260910-suggestions-1";'
          )

          replace(
              "src/js/app.js",
              '''        loadScript("/src/js/modes.js", function() {\n            loadScript("/src/js/app_core.js", function() {\n                console.log("smurdy: bootstrap loaded quiz entities + modes + app_core");\n            });\n        });''',
              '''        loadScript("/src/js/modes.js", function() {\n            loadScript("/src/js/quiz_suggestions.js", function() {\n                loadScript("/src/js/app_core.js", function() {\n                    console.log("smurdy: bootstrap loaded quiz entities + modes + suggestions + app_core");\n                });\n            });\n        });'''
          )

          replace(
              "index.html",
              '/src/js/app.js?v=20260910-memory-1',
              '/src/js/app.js?v=20260910-suggestions-1'
          )

          replace(
              "src/js/quiz_runner.js",
              '''            const completionPanel = document.getElementById("quiz-panel");\n            if (completionPanel) completion.renderShare(completionPanel, lastCompletionResult);\n\n            if (weakSpotsPracticeStage) {''',
              '''            const completionPanel = document.getElementById("quiz-panel");\n            if (completionPanel) completion.renderShare(completionPanel, lastCompletionResult);\n            if (!weakSpotsPracticeStage && !retryWeakSpots && !anyTestMode) {\n                try { window.SmurdyQuizSuggestions?.show?.(lastCompletionResult); } catch (_) {}\n            }\n\n            if (weakSpotsPracticeStage) {'''
          )

          replace(
              "src/js/flag_quiz.js",
              '''            updateStats();\n            analyticsReporter.complete(lastCompletionResult);\n\n            if (weakSpotsPracticeStage) {''',
              '''            updateStats();\n            analyticsReporter.complete(lastCompletionResult);\n            if (!weakSpotsPracticeStage && !retryWeakSpots) {\n                try { root.SmurdyQuizSuggestions?.show?.(lastCompletionResult); } catch (_) {}\n            }\n\n            if (weakSpotsPracticeStage) {'''
          )

          replace(
              "tools/generate_flag_pages.js",
              '<script src="/src/js/quiz_completion.js?v=20260909-editorial-1" defer></script>',
              '<script src="/src/js/quiz_completion.js?v=20260909-editorial-1" defer></script>\n  <script src="/src/js/quiz_suggestions.js?v=20260910-suggestions-1" defer></script>'
          )
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Regenerate public pages
        env:
          SITEMAP_LASTMOD: 2026-09-10
        run: npm run pages:generate

      - name: JavaScript syntax checks
        run: |
          node --check src/js/quiz_suggestions.js
          node --check src/js/app.js
          node --check src/js/quiz_runner.js
          node --check src/js/flag_quiz.js
          node --check tools/generate_flag_pages.js

      - name: Run tests
        run: npm test

      - name: Validate generated integration
        run: |
          grep -q 'quiz_suggestions.js?v=20260910-suggestions-1' quizzes/type-flag/world/index.html
          grep -q 'app.js?v=20260910-suggestions-1' index.html
          grep -q 'SmurdyQuizSuggestions?.show' src/js/quiz_runner.js
          grep -q 'SmurdyQuizSuggestions?.show' src/js/flag_quiz.js
          git diff --check

      - name: Commit implementation and generated pages
        run: |
          rm .github/workflows/oneoff-completion-suggestions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add post-completion quiz recommendations"
          git push origin HEAD:feature/post-completion-suggestions
