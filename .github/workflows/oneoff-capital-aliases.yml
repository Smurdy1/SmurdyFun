name: One-off comprehensive capital aliases

on:
  push:
    branches:
      - feature/comprehensive-capital-aliases

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comprehensive-capital-aliases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Rebuild capitals with Wikidata aliases
        run: npm run capitals:sync
      - name: Check syntax
        run: |
          node --check tools/build_capitals.js
          node --check src/js/capital_quiz.js
      - name: Run capital alias and full tests
        run: |
          node --test tests/capitals_data.test.js tests/capital_quiz.test.js
          npm test
      - name: Validate diff
        run: git diff --check
      - name: Commit generated aliases
        run: |
          rm -f .github/workflows/oneoff-capital-aliases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate comprehensive capital aliases"
          git push origin HEAD:feature/comprehensive-capital-aliases
