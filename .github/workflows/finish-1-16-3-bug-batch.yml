name: Finish 1.16.3 bugfix batch

on:
  push:
    branches:
      - fix/1.16.3-bug-batch

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message != 'Finish 1.16.3 bugfix batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.16.3-bug-batch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bugfix patch
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          old = subprocess.check_output([
              "git", "show", "bab9cea167f6d238636d1360782252320c80e355:.github/workflows/finish-1-16-3-bug-batch.yml"
          ], text=True)
          marker = "          python3 - <<'PY'\n"
          start = old.index(marker) + len(marker)
          end = old.index("\n          PY", start)
          block = old[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, "bugfix_1_16_3.py", "exec"))

          lore_test = Path("tests/lore_system.test.js")
          s = lore_test.read_text().replace(
              'quiz_launch_intent\\.js\\?v=20260914-launch-intent-hotfix-1',
              'quiz_launch_intent\\.js\\?v=20260915-launch-intent-2'
          )
          lore_test.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Regenerate quiz pages
        run: |
          node tools/generate_quiz_pages.js
          node tools/generate_flag_pages.js
          node tools/normalize_quiz_routes.js
          node tools/apply_sharing.js
          node tools/strip_generated_whitespace.js
      - name: Refresh changed asset cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("index.html"), Path("about/index.html"), Path("contact/index.html"), Path("privacy/index.html"), Path("404.html"), Path("quizzes")]
          files = []
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.is_dir(): files.extend(root.rglob("*.html"))
          for p in files:
              s = p.read_text()
              s = s.replace("20260914-dark-mode-5", "20260915-dark-mode-6")
              s = re.sub(r'quiz_launch_intent\.js\?v=[A-Za-z0-9._-]+', 'quiz_launch_intent.js?v=20260915-launch-intent-2', s)
              p.write_text(s)
          PY
      - name: Validate changed JavaScript
        run: |
          node --check src/js/quiz_launch_intent.js
          node --check src/js/quiz_landing.js
          node --check src/js/browse.js
          node --check src/js/theme.js
          node --check tools/quiz_page_shell.js
          node --check tools/generate_quiz_pages.js
          node --check tools/generate_flag_pages.js
      - name: Run full test suite
        run: npm test
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit finished batch
        run: |
          rm .github/workflows/finish-1-16-3-bug-batch.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "Smurdy"
          git config user.email "110361649+Smurdy1@users.noreply.github.com"
          git add -A
          git commit -m "Finish 1.16.3 bugfix batch"
          git push origin HEAD:fix/1.16.3-bug-batch
