name: One-off US state capitals build

on:
  push:
    branches:
      - feature/us-state-capitals

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/us-state-capitals
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Rebuild country and state capitals
        run: npm run capitals:sync

      - name: Regenerate quiz pages
        env:
          SITEMAP_LASTMOD: '2026-09-09'
        run: npm run pages:generate

      - name: Check JavaScript syntax
        run: |
          node --check tools/build_capitals.js
          node --check tools/generate_quiz_pages.js
          node --check tools/quiz_page_shell.js
          node --check src/js/capital_quiz.js
          node --check src/js/manifest.js
          node --check src/js/browse.js
          node --check src/js/app.js
          node --check src/js/app_core.js
          node --check src/js/quiz_runner.js
          node --check src/js/weak_spots.js

      - name: Run state-capital and full tests
        run: |
          node --test tests/capitals_data.test.js tests/capital_quiz.test.js tests/quiz_definitions.test.js tests/weak_spots.test.js
          npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit generated state capitals
        run: |
          rm -f .github/workflows/oneoff-us-state-capitals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated US state capitals quiz"
          git push origin HEAD:feature/us-state-capitals
